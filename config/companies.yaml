companies:
- id: tencent
  name: 腾讯
  enabled: true
  urls:
    social: https://careers.tencent.com/search.html?query={keyword}
    campus: https://careers.tencent.com/search.html?query={keyword}
  api:
    pattern: tencentcareer/api/post/Query
    data_path: Data.Posts
    type: intercept
  field_mappings:
    id:
      source: PostId
    title:
      source: RecruitPostName
    location:
      source: LocationName
    category:
      source: CategoryName
    publish_time:
      source: LastUpdateTime
    duty:
      source: Responsibility
    product:
      source: ProductName
    bg:
      source: BGName
    work_years:
      source: RequireWorkYearsName
  url_template: https://careers.tencent.com/position_detail.html?id={id}
  job_type_detection:
    internship:
    - 实习
    - intern
    campus:
    - 校招
    - 应届
    social: []
- id: bytedance
  name: 字节跳动
  enabled: true
  urls:
    social: https://jobs.bytedance.com/campus/position?keyword={keyword}
    campus: https://jobs.bytedance.com/campus/position?keyword={keyword}
  api:
    pattern: search/job/posts
    data_path: data.job_post_list
    type: intercept
  field_mappings:
    id:
      source: id
    title:
      source: title
    location:
      source: city_info.name
    category:
      source: job_category.name
    publish_time:
      source: publish_time
    duty:
      source: description
    requirement:
      source: requirement
  url_template: https://jobs.bytedance.com/campus/position/detail/{id}
  job_type_detection:
    internship:
    - 实习
    - intern
    campus:
    - 校招
    - 应届
    - ByteIntern
    social: []
