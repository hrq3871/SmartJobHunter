# SmartJobHunter 通用求职意向配置 Schema
#
# 这是文档型 schema，用于指导 profile 编写和测试校验。运行时仍兼容旧字段：
# keywords -> must_have, exclude_keywords -> avoid, job_type -> employment_types。

required:
  - name
  - enabled
  - resume
  - target_roles

optional:
  - intent
  - target_domains
  - employment_types
  - seniority
  - locations
  - must_have
  - nice_to_have
  - avoid
  - dealbreakers
  - preferences
  - threshold_score
  - max_jobs_per_report
  - keywords
  - exclude_keywords
  - job_type

example:
  name: "数据分析-实习"
  enabled: true
  resume: "./resumes/example_data_resume.pdf"
  target_roles:
    - "数据分析实习生"
    - "商业分析实习生"
  target_domains:
    - "互联网"
    - "金融科技"
  employment_types:
    - "实习"
  must_have:
    - "SQL"
    - "Python"
    - "数据分析项目"
  nice_to_have:
    - "A/B 实验"
    - "指标体系"
  avoid:
    - "电话销售"
    - "纯运营"
  preferences:
    locations:
      - "北京"
      - "上海"
    weekly_intern_days: 4
  threshold_score: 70
  max_jobs_per_report: 20
