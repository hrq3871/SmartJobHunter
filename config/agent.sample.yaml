# Agent decision settings
decision_level: "moderate"  # conservative / moderate / aggressive
time_filter_days: 3
threshold_score: 70
jd_truncate_length: 6000

# Agent-led semantic review.
# Python writes candidate queues under output/<date>/agent_review_queues/.
# Formal recommendations require the current Agent to write matching *_results.json.
agent_review:
  required_for_recommendation: true
  results_path: ""

# Model selection strategy
model_strategy:
  simple_tasks: "haiku"
  complex_tasks: "sonnet"

# Semantic filter thresholds
semantic_filter:
  conservative: 0.8
  moderate: 0.6
  aggressive: 0.4

# Output settings
output:
  max_jobs_per_report: 20
  include_company_background: true

# Feishu/Lark settings
# Copy this file to config/agent.yaml and fill these values locally.
# Do not commit config/agent.yaml.
feishu:
  app_id: ""
  app_secret: ""
  wiki_node_token: ""
  bitable_token: ""
  bitable_table_id: ""
  # Optional real-run evaluation annotation resources.
  # `setup` can create them in the same Bitable/Wiki space and write IDs locally.
  eval_annotation_table_id: ""
  eval_badcase_doc_id: ""
  eval_badcase_doc_url: ""
  enabled: false
