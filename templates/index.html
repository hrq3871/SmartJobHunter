<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartJobHunter Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.7/dist/docx-preview.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg: #F8FAFC; --surface: #FFFFFF; --primary: #1E40AF; --primary-light: #3B82F6;
  --primary-bg: #EFF6FF; --accent: #D97706; --accent-bg: #FFF7ED;
  --text: #1E293B; --text-secondary: #475569; --text-muted: #94A3B8;
  --border: #DBEAFE; --border-light: #E2E8F0; --border-subtle: #F1F5F9;
  --muted: #E9EEF6; --muted-bg: #F1F5F9;
  --green: #16A34A; --green-bg: #F0FDF4; --red: #DC2626; --red-bg: #FEF2F2;
  --yellow: #CA8A04; --yellow-bg: #FEFCE8; --shadow-card: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-modal: 0 20px 60px rgba(0,0,0,.15); --shadow-hover: 0 4px 16px rgba(0,0,0,.08);
  --font-mono: 'Fira Code','Consolas',monospace; --font-sans: 'Fira Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius: 10px; --radius-sm: 6px;
  --transition: 180ms ease;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 1px 2px rgba(0,0,0,.04)}
header h1{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
header h1 span{color:var(--accent);font-weight:500}

nav{display:flex;gap:2px}
nav button{background:transparent;color:var(--text-secondary);border:none;padding:8px 18px;cursor:pointer;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;font-weight:500;white-space:nowrap;transition:all var(--transition);display:flex;align-items:center;gap:7px;position:relative}
nav button:hover{background:var(--muted);color:var(--text)}
nav button.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
nav button.active::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--primary);border-radius:1px}
.sub-tab{font-size:13px;padding:7px 18px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all var(--transition);font-family:var(--font-sans)}
.sub-tab:hover{background:var(--muted)}
.sub-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

main{max-width:1500px;margin:0 auto;padding:28px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-card);transition:box-shadow var(--transition)}
.card:hover{box-shadow:var(--shadow-hover)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-header h2,.card-header h3{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:.3px}

/* Company Grid */
.company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:14px}
.company-card{border:1px solid var(--border-light);border-radius:var(--radius);padding:18px;background:var(--surface);transition:all var(--transition);position:relative}
.company-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow-hover)}
.company-card.disabled{opacity:.65;background:var(--muted-bg)}
.company-card .c-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.company-card .c-name{font-weight:600;font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.company-card .c-urls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.company-card .c-urls a{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;text-decoration:none;background:var(--primary-bg);color:var(--primary);border:1px solid var(--border);transition:all var(--transition)}
.company-card .c-urls a:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.company-card .c-note{font-size:12px;color:var(--text-muted);margin-top:6px}
.company-card .c-actions{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-subtle)}

/* Report two-column */
.report-layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:1000px){.report-layout{grid-template-columns:1fr}}
.report-sidebar{position:sticky;top:80px}

/* Health mini-panel inside companies tab */
.health-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.health-strip .hs-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:14px 18px;text-align:center;transition:all var(--transition);cursor:pointer}
.health-strip .hs-card:hover{box-shadow:var(--shadow-hover)}
.hs-card .hs-num{font-family:var(--font-mono);font-size:26px;font-weight:700}
.hs-card .hs-label{font-size:11px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.hs-card.hs-total{border-left:3px solid var(--primary)}
.hs-card.hs-pending{border-left:3px solid var(--yellow)}
.hs-card.hs-blocked{border-left:3px solid var(--red)}
.hs-card.hs-failed{border-left:3px solid var(--text-muted)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:999;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);border-radius:14px;width:560px;max-width:94vw;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-modal);animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border-light);position:sticky;top:0;background:var(--surface);z-index:1;border-radius:14px 14px 0 0}
.modal-body{padding:24px}
.modal-body label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;margin-top:12px;text-transform:uppercase;letter-spacing:.4px}
.modal-body label:first-child{margin-top:0}
.modal-body .hint{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Tooltip */
.tooltip-wrap{position:relative;display:inline-flex;align-items:center}
.tooltip-trigger{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--muted);color:var(--text-muted);font-size:11px;font-weight:700;cursor:help;border:none;transition:all var(--transition)}
.tooltip-trigger:hover{background:var(--primary);color:#fff}
.tooltip-box{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.6;white-space:normal;width:260px;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none}
.tooltip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--text)}
.tooltip-wrap:hover .tooltip-box{display:block}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-ok{background:var(--green-bg);color:var(--green)}
.badge-warn{background:var(--yellow-bg);color:var(--yellow)}
.badge-err{background:var(--red-bg);color:var(--red)}
.badge-info{background:var(--primary-bg);color:var(--primary)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all var(--transition);white-space:nowrap;letter-spacing:.2px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(30,64,175,.25)}
.btn-primary:hover{background:#1E3A8A;box-shadow:0 2px 6px rgba(30,64,175,.35)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text-secondary)}
.btn-outline:hover{background:var(--muted);color:var(--text);border-color:var(--primary-light)}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:4px 10px;font-size:11px}

/* Toggle */
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.toggle input{display:none}
.toggle-track{width:38px;height:21px;background:#CBD5E1;border-radius:10px;position:relative;transition:background var(--transition)}
.toggle input:checked+.toggle-track{background:var(--green)}
.toggle-track::after{content:'';position:absolute;width:17px;height:17px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform var(--transition);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.toggle input:checked+.toggle-track::after{transform:translateX(17px)}

/* Table rows */
.row{display:grid;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-subtle);gap:12px;font-size:13px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg);margin:0 -20px;padding-left:20px;padding-right:20px}

/* Forms */
input[type="text"],input[type="url"],input[type="password"],input[type="search"],select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;background:var(--bg);color:var(--text);transition:all var(--transition)}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.search-bar{position:relative}
.search-bar input{padding-left:34px}
.search-bar::before{content:'\1F50D';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none}

/* Upload */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:all var(--transition);color:var(--text-muted);background:var(--bg)}
.upload-zone:hover{border-color:var(--primary-light);background:var(--primary-bg);color:var(--primary)}
.upload-zone.drag-over{border-color:var(--primary);background:var(--primary-bg)}

/* Markdown */
.markdown-body{font-size:14px;line-height:1.85;color:var(--text)}
.markdown-body h1{font-size:20px;margin:16px 0 8px;color:var(--primary);font-family:var(--font-mono)}
.markdown-body h2{font-size:16px;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.markdown-body h3{font-size:14px;margin:14px 0 6px}
.markdown-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.markdown-body th,.markdown-body td{border:1px solid var(--border-light);padding:7px 12px;text-align:left}
.markdown-body th{background:var(--primary-bg);font-weight:600;font-size:12px}
.markdown-body code{font-family:var(--font-mono);font-size:12px;background:var(--muted);padding:2px 5px;border-radius:3px}
.markdown-body pre{background:var(--bg);border:1px solid var(--border);padding:14px;overflow-x:auto;font-size:12px;line-height:1.6;border-radius:var(--radius-sm)}
.markdown-body a{color:var(--primary);text-decoration:underline}
.markdown-body hr{margin:18px 0;border:none;border-top:1px solid var(--border)}
.markdown-body strong{color:var(--text)}

@media(max-width:768px){header{padding:0 12px}header h1{font-size:14px}nav button{padding:6px 10px;font-size:11px}main{padding:12px}.company-grid{grid-template-columns:1fr}}

.text-muted{color:var(--text-muted)}.text-sm{font-size:12px}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}.gap-1{gap:4px}.gap-2{gap:8px}.flex-wrap{flex-wrap:wrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
code{font-family:var(--font-mono);font-size:12px;background:var(--muted);padding:1px 5px;border-radius:3px;color:var(--primary)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;animation:toastIn .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.15)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.checkbox{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.kw-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--accent-bg);color:var(--accent);margin:1px 2px}
</style>
</head>
<body>

<header>
  <h1>&#x1f3af; SmartJobHunter <span>Console</span></h1>
  <nav id="tabs">
    <button class="active" data-tab="strategy">&#x2699;&#xfe0f; 公司与策略</button>
    <button data-tab="tasks">&#x1f4ca; 简历与巡检</button>
  </nav>
</header>

<main id="content"></main>

<script>
const $=(s,c)=>(c||document).querySelector(s);
const $$=(s,c)=>[...(c||document).querySelectorAll(s)];

async function api(path,opts={}){
  const res=await fetch(path,{headers:opts.body instanceof FormData?{}:{'Content-Type':'application/json'},...opts});
  if(!res.ok){const msg=await res.text().catch(()=>'');throw new Error(msg||`${res.status}`)}
  const ct=res.headers.get('content-type')||'';
  return ct.includes('application/json')?res.json():res.text();
}
function toast(m){const el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
function fs(b){return b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const LABEL={'social':'社招','campus':'校招','internship':'实习'};

// ── Tab routing ──
const renderers={};
function loadTab(n){const f=renderers[n];if(!f)return;document.getElementById('content').innerHTML='<div class="empty-state"><span class="spinner"></span> 加载中...</div>';try{f()}catch(e){document.getElementById('content').innerHTML=`<div class="card" style="border-color:var(--red)"><h3>渲染错误</h3><p>${esc(e.message)}</p><pre class="text-sm" style="margin-top:8px">${esc(e.stack||'')}</pre></div>`}}
$$('nav button').forEach(b=>b.addEventListener('click',()=>{$$('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadTab(b.dataset.tab)}));

// ── Modal helper ──
function showModal(title,bodyHtml,width='560px'){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-box" style="width:${width}"><div class="modal-header"><h3 style="font-family:var(--font-mono);font-size:13px;color:var(--primary);letter-spacing:.3px">${title}</h3><button class="btn btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove()">&#x2715; 关闭</button></div><div class="modal-body">${bodyHtml}</div></div>`;
  document.body.appendChild(ov);
  // Prevent drag events from reaching upload zone behind modal
  ov.addEventListener('dragover',e=>e.preventDefault());
  ov.addEventListener('drop',e=>e.preventDefault());
}

// ══════════════════════════════════════════════
// Tab 1: 公司与策略 (sub-tabs: companies | health)
// ══════════════════════════════════════════════
let _coData=[],_healthData=null,_coFilter='all',_coHealthFilter='all',_selCompanies=new Set(),_strategySubTab='companies';
renderers.strategy=()=>{renderStrategyLayout()};

async function renderStrategyLayout(){
  const[companies,health]=await Promise.all([api('/api/companies'),api('/api/health')]);
  _coData=companies;_healthData=health;
  // Build sub-nav
  const html=`
    <div class="card" style="padding:8px 20px;margin-bottom:16px"><div style="display:flex;gap:8px;align-items:center">
      <button class="sub-tab ${_strategySubTab==='companies'?'active':''}" onclick="_strategySubTab='companies';renderStrategyContent()">&#x1f4cb; 公司列表 (${companies.length})</button>
      <button class="sub-tab ${_strategySubTab==='health'?'active':''}" onclick="_strategySubTab='health';renderStrategyContent()">&#x1fa79; 策略健康 (${health.summary.total})</button>
    </div></div>
    <div id="strategyContent"></div>`;
  document.getElementById('content').innerHTML=html;
  renderStrategyContent();
}
window.renderStrategyContent=()=>{
  const sc=document.getElementById('strategyContent');if(!sc)return;
  if(_strategySubTab==='health'){renderHealthPanel(_healthData);return}
  sc.innerHTML='';
  renderCompanyGrid(_sortCompanies(_coData,_coFilter));
};
window.switchStrategySubTab=(tab)=>{_strategySubTab=tab;renderStrategyLayout()};

function _sortCompanies(list,statusFilter){
  let out=[...list];
  out.sort((a,b)=>(b.enabled-a.enabled)||a.name.localeCompare(b.name,'zh'));
  // Status filter
  if(statusFilter==='enabled') out=out.filter(c=>c.enabled);
  else if(statusFilter==='disabled') out=out.filter(c=>!c.enabled);
  // Health filter (independent)
  if(_coHealthFilter==='pending'&&_healthData){
    const pendingIds=new Set((_healthData.tasks||[]).filter(t=>t.status==='pending').map(t=>t.company_id));
    out=out.filter(c=>pendingIds.has(c.id));
  }
  return out;
}

function renderHealthPanel(health){
  const s=health.summary||{total:0,pending:0,blocked:0,failed:0};
  const statusClass=st=>st==='blocked'?'badge-err':st==='pending'?'badge-warn':st==='repaired'?'badge-ok':'badge-info';
  const statusLabel=st=>({pending:'待处理',blocked:'阻塞',failed:'失败',repaired:'已修复'}[st]||st);
  const sc=document.getElementById('strategyContent');if(!sc)return;
  if(s.total===0){
    sc.innerHTML=`<div class="card"><div class="card-header"><h3>&#x1fa79; 策略健康</h3><button class="btn btn-outline btn-sm" onclick="refreshHealth()">&#x21bb; 刷新</button></div><div class="empty-state">&#x2705; 所有已启用公司抓取策略正常</div></div>`;
    return;
  }
  let h=`<div class="card"><div class="card-header"><h3>&#x1fa79; 策略健康</h3><button class="btn btn-outline btn-sm" onclick="refreshHealth()">&#x21bb; 刷新</button></div>`;
  h+=`<div class="health-strip"><div class="hs-card hs-total"><div class="hs-num" style="color:var(--primary)">${s.total}</div><div class="hs-label">总异常</div></div><div class="hs-card hs-pending"><div class="hs-num" style="color:var(--yellow)">${s.pending}</div><div class="hs-label">待处理</div></div><div class="hs-card hs-blocked"><div class="hs-num" style="color:var(--red)">${s.blocked}</div><div class="hs-label">阻塞</div></div><div class="hs-card hs-failed"><div class="hs-num" style="color:var(--text-muted)">${s.failed}</div><div class="hs-label">失败</div></div></div>`;
  h+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="btn btn-outline btn-sm" onclick="window._selectAllHealth()">全选</button><button class="btn btn-outline btn-sm" onclick="window._clearHealthSel()">取消</button><button class="btn btn-primary btn-sm" id="batchRepairBtn" disabled onclick="batchRepair()">&#x1f6e0; 批量修复 (0)</button></div>`;
  for(const t of health.tasks){
    h+=`<div class="row" style="grid-template-columns:auto 1fr auto auto"><input type="checkbox" class="checkbox hc-cb" data-cid="${esc(t.company_id)}" onchange="toggleHcSel('${esc(t.company_id)}',this.checked)"><div><strong>${esc(t.company_name)}</strong> <span class="badge ${statusClass(t.status)}">${statusLabel(t.status)}</span><div class="text-sm mt-1" style="color:var(--text-secondary)">${esc(t.reason_label||t.reason)}</div></div><span class="text-muted text-sm">${(t.created_at||'').slice(0,16)}</span><button class="btn btn-outline btn-sm" onclick="retryOne('${esc(t.company_id)}')">&#x1f6e0; 重试</button></div>`;
  }
  h+=`</div>`;
  sc.innerHTML=h;
}
window.refreshHealth=async()=>{
  const h=await api('/api/health');_healthData=h;
  if(_strategySubTab==='health')renderHealthPanel(h);
  _updateCoHealthBadges();
  // Update sub-tab badge count
  const hbtn=document.querySelector('button[onclick*=\"_strategySubTab=\'health\'\"]');
  if(hbtn)hbtn.textContent=`\u{1fa79} 策略健康 (${h.summary.total})`;
};
window._updateCoHealthBadges=()=>{
  const map={};if(_healthData)for(const t of _healthData.tasks||[]){map[t.company_id]=t}
  $$('.company-card').forEach(card=>{
    const cid=card.dataset.cid;const h=map[cid];const badgeEl=card.querySelector('.health-badge');

let _tasksSelectedResume=null;

renderers.tasks=async()=>{
  try{
  const[cfg,reports,resumeList]=await Promise.all([api('/api/config'),api('/api/reports'),api('/api/resumes')]);
  const rptByResume={};for(const r of reports){const k=_findResumeForReport(r,cfg.profiles||[]);if(!rptByResume[k])rptByResume[k]=[];rptByResume[k].push(r)}
  const fconf=cfg.feishu||{};

  // Left: resume list + upload
  let left='<div class="card" style="margin-bottom:12px"><div class="card-header"><h3>&#x1f4c4; 简历列表 ('+resumeList.length+')</h3></div>';
  left+='<div class="upload-zone" id="dropZone" style="padding:16px;margin-bottom:12px"><div style="font-size:20px">+ 上传简历</div><div class="text-sm text-muted">拖拽或点击，支持 .txt .md .docx .pdf .png .jpg</div><input type="file" id="resumeInput" accept=".txt,.md,.docx,.pdf,.png,.jpg,.jpeg" multiple style="display:none"></div><div id="uploadStatus" class="text-sm" style="margin-bottom:8px"></div>';
  if(resumeList.length===0){left+='<div class="text-sm text-muted">暂无简历</div>'}
  else{
    const sorted=[...resumeList].sort((a,b)=>b.modified?.localeCompare(a.modified||''));
    for(const r of sorted){
      const cnt=(rptByResume[r.name]||[]).length;
      const sel=_tasksSelectedResume===r.name;
      left+=`<div class="row" style="grid-template-columns:1fr auto;cursor:pointer;${sel?'background:var(--primary-bg);margin:0 -20px;padding-left:20px;padding-right:20px':''}" onclick="_tasksSelectedResume='${esc(r.name)}';renderers.tasks()">
        <div><span>&#x1f4c4; <strong>${esc(r.name)}</strong></span><span class="text-sm text-muted" style="margin-left:4px">${fs(r.size)}</span><div class="text-sm text-muted">${cnt} 份报告</div></div>
        <div class="flex gap-1"><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();previewResumeInline('${esc(r.name)}')">&#x1f441;</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteResumeAndRefresh('${esc(r.name)}')">&#x1f5d1;</button></div>
      </div>`;
    }
  }
  left+='</div>';

  // Feishu + run
  left+=`<div class="card"><div class="card-header"><h3>&#x1f4e1; 飞书推送 <span class="tooltip-wrap" style="margin-left:6px"><button class="tooltip-trigger">?</button><div class="tooltip-box">在飞书开放平台创建企业自建应用，获取 App ID 和 App Secret，开启机器人能力，在知识库中创建知识空间获取 Wiki Token，在多维表格中获取 Bitable Token 和 Table ID。填入后开启推送开关即可。</div></span></h3></div>`;
  left+=`<label class="toggle" style="margin-bottom:10px"><input type="checkbox" ${fconf.enabled?"checked":""} onchange="toggleFs(this.checked)"><div class="toggle-track"></div><span>${fconf.enabled?"推送已开启":"推送已关闭"}</span></label>`;
  left+='<details><summary class="text-sm" style="cursor:pointer;color:var(--text-secondary)">编辑凭证</summary><div style="margin-top:8px">';
  left+=`<input id="fsAppId" class="text-sm" value="${esc(fconf.app_id||"")}" placeholder="App ID" style="margin-bottom:4px"><input id="fsAppSecret" type="password" class="text-sm" value="${esc(fconf.app_secret||"")}" placeholder="App Secret" style="margin-bottom:4px"><input id="fsWiki" class="text-sm" value="${esc(fconf.wiki_node_token||"")}" placeholder="Wiki Token" style="margin-bottom:4px"><input id="fsBitable" class="text-sm" value="${esc(fconf.bitable_token||"")}" placeholder="Bitable Token" style="margin-bottom:4px"><input id="fsTableId" class="text-sm" value="${esc(fconf.bitable_table_id||"")}" placeholder="Table ID">`;
  left+='<button class="btn btn-primary btn-sm mt-2" onclick="saveFs()">保存</button></div></details></div>';
  left+=`<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="toast('请在终端运行 python -m src.cli')">&#x25b6; 运行巡检</button>`;

  // Right: selected resume details
  let right='<div class="card"><div class="card-header"><h3>&#x1f4c4; 巡检结果</h3></div>';
  if(!_tasksSelectedResume||!resumeList.find(x=>x.name===_tasksSelectedResume)){
    _tasksSelectedResume=resumeList[0]?.name||null;
  }
  if(_tasksSelectedResume){
    const rr=rptByResume[_tasksSelectedResume]||[];
    const r=resumeList.find(x=>x.name===_tasksSelectedResume);
    const pf=(cfg.profiles||[]).find(p=>p.resume&&p.resume.includes(_tasksSelectedResume));
    right+=`<div style="margin-bottom:8px"><strong>${esc(_tasksSelectedResume)}</strong><span class="text-muted text-sm" style="margin-left:8px">${esc(r?.format||'')} · ${fs(r?.size||0)}</span>`;
    if(pf){right+=`<div class="text-sm mt-2"><span class="kw-tag">${esc(pf.job_type||'')}</span>`;if(pf.keywords)for(const k of pf.keywords)right+=`<span class="kw-tag">${esc(k)}</span>`;right+=` <label class="toggle" style="margin-left:8px"><input type="checkbox" ${pf.enabled?"checked":""} onchange="togglePf('${esc(pf.name)}',this.checked)"><div class="toggle-track"></div></label></div>`}
    else right+='<div class="text-sm text-muted mt-2">Agent 运行后自动关联意向</div>';
    right+='</div>';

      right+=`<div class="row" style="grid-template-columns:1fr auto;cursor:pointer" onclick="viewReport('${esc(rpt.relpath)}')"><div><strong>${esc(rpt.generated||"")}</strong><span class="text-muted text-sm" style="margin-left:8px">${rpt.job_count} 岗位 · 最高 ${rpt.top_score||0} 分</span></div><span class="text-sm text-muted">${fs(rpt.size)}</span></div>`;

  document.getElementById('content').innerHTML=`<div class="report-layout"><div class="report-sidebar">${left}</div><div>${right}</div></div>`;

  // Setup upload handlers
  setTimeout(()=>{
    const zone=$('#dropZone'),input=$('#resumeInput');
    if(!zone||!input)return;
    zone.addEventListener('click',()=>input.click());
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over')});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');doUpload(e.dataTransfer.files)});
    input.addEventListener('change',()=>doUpload(input.files));
  },100);
  }catch(e){document.getElementById('content').innerHTML=`<div class="card" style="border-color:var(--red)"><h3>渲染失败</h3><p>${esc(e.message)}</p></div>`}
};

function _findResumeForReport(report,profiles){
  if(!report.profile)return 'unknown';
  const pf=profiles.find(p=>p.name===report.profile);
  if(pf?.resume)return pf.resume.replace(/^.*[\\/]/,'');
  return report.profile;
}

async function doUpload(files){
  const s=$('#uploadStatus');if(!s||!files.length)return;
  for(const f of files){
    s.innerHTML='<span class="spinner"></span> 分析: '+esc(f.name)+'...';
    const fd=new FormData();fd.append('file',f);
    try{
      const r=await fetch('/api/resumes/analyze',{method:'POST',body:fd}).then(r=>r.json());
      if(!r.ok){s.innerHTML='&#x274c; '+esc(f.name);continue}
      // Show confirmation modal
      const kw=r.suggested_keywords||[];
      showModal('&#x1f4c4; 确认求职意向 — '+esc(r.filename),
        `<div class="text-sm" style="margin-bottom:12px">已分析简历内容，建议以下配置：</div>
        <label>意向名称</label><input id="cfmName" value="${esc(r.suggested_name||'')}">
        <label>岗位类型</label><div style="display:flex;gap:16px;padding:8px 0">${['社招','校招','实习'].map(t=>`<label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px"><input type="checkbox" class="cfmJobType" value="${t}" ${r.suggested_job_type===t?'checked':''}> ${t}</label>`).join('')}</div>
        <label>搜索关键词 <span class="text-muted text-sm">(用逗号或空格分隔)</span></label><input id="cfmKw" value="${esc(kw.join(', '))}" placeholder="例: 产品经理, TOB, SaaS">
        <div class="text-sm text-muted mt-2">文件: ${esc(r.filename)} · ${fs(r.size)} · ${esc(r.format)}</div>
        ${r.text_preview?`<div class="text-sm text-muted mt-2" style="max-height:100px;overflow-y:auto;background:var(--bg);padding:8px;border-radius:4px">${esc(r.text_preview)}</div>`:''}
        <div class="mt-3 flex gap-2"><button class="btn btn-primary" id="cfmBtn">确认上传并创建意向</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove();setTimeout(()=>renderers.tasks(),300)">取消</button></div>`,
        '520px'
      );
      // Bind confirm
      setTimeout(()=>{
        const btn=$('#cfmBtn');if(!btn)return;
        btn.addEventListener('click',async()=>{
          btn.disabled=true;btn.innerHTML='<span class="spinner"></span> 保存中...';
          const kwRaw=$('#cfmKw')?.value||kw.join(',');
          const kwList=kwRaw.split(/[,，\s]+/).map(x=>x.trim()).filter(Boolean);
          const jobTypes=[...document.querySelectorAll('.cfmJobType:checked')].map(cb=>cb.value);
          try{
            const cfm=await api('/api/resumes/confirm',{method:'POST',body:JSON.stringify({
              filename:r.filename,
              keywords:kwList,
              job_types:jobTypes.length?jobTypes:['社招'],
              profile_name:$('#cfmName')?.value||r.suggested_name
            })});
            document.querySelector('.modal-overlay')?.remove();
            s.innerHTML='&#x2705; '+esc(cfm.filename)+' — 意向「'+esc(cfm.profile_name)+'」已创建';
            setTimeout(()=>renderers.tasks(),600);
          }catch(e){s.innerHTML='&#x274c; '+esc(e.message);btn.disabled=false;btn.textContent='确认上传并创建意向'}
        });
      },100);
    }catch(e){s.innerHTML='&#x274c; '+esc(e.message)}
  }
  // Don't auto-refresh — user needs time to fill the confirmation modal.
  // Page refreshes after confirm/cancel actions instead.
}

window.deleteResumeAndRefresh=async(name)=>{
  if(!confirm('删除简历 "'+name+'"？'))return;
  await api('/api/resumes/'+encodeURIComponent(name),{method:'DELETE'});
  if(_tasksSelectedResume===name)_tasksSelectedResume=null;
  renderers.tasks();
};
