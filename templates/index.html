<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartJobHunter Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #F8FAFC; --surface: #FFFFFF; --primary: #1E40AF; --primary-light: #3B82F6;
  --primary-bg: #EFF6FF; --accent: #D97706; --accent-bg: #FFF7ED;
  --text: #1E293B; --text-secondary: #475569; --text-muted: #94A3B8;
  --border: #DBEAFE; --border-light: #E2E8F0; --border-subtle: #F1F5F9;
  --muted: #E9EEF6; --muted-bg: #F1F5F9;
  --green: #16A34A; --green-bg: #F0FDF4; --red: #DC2626; --red-bg: #FEF2F2;
  --yellow: #CA8A04; --yellow-bg: #FEFCE8; --shadow-card: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-modal: 0 20px 60px rgba(0,0,0,.15); --shadow-hover: 0 4px 16px rgba(0,0,0,.08);
  --font-mono: 'Fira Code','Consolas',monospace; --font-sans: 'Fira Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius: 10px; --radius-sm: 6px;
  --transition: 180ms ease;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 1px 2px rgba(0,0,0,.04)}
header h1{font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
header h1 span{color:var(--accent);font-weight:500}

nav{display:flex;gap:2px}
nav button{background:transparent;color:var(--text-secondary);border:none;padding:8px 18px;cursor:pointer;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;font-weight:500;white-space:nowrap;transition:all var(--transition);display:flex;align-items:center;gap:7px;position:relative}
nav button:hover{background:var(--muted);color:var(--text)}
nav button.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
nav button.active::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--primary);border-radius:1px}

main{max-width:1500px;margin:0 auto;padding:28px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-card);transition:box-shadow var(--transition)}
.card:hover{box-shadow:var(--shadow-hover)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-header h2,.card-header h3{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--primary);text-transform:uppercase;letter-spacing:.3px}

/* Company Grid */
.company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:14px}
.company-card{border:1px solid var(--border-light);border-radius:var(--radius);padding:18px;background:var(--surface);transition:all var(--transition);position:relative}
.company-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow-hover)}
.company-card.disabled{opacity:.65;background:var(--muted-bg)}
.company-card .c-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.company-card .c-name{font-weight:600;font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.company-card .c-urls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.company-card .c-urls a{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;text-decoration:none;background:var(--primary-bg);color:var(--primary);border:1px solid var(--border);transition:all var(--transition)}
.company-card .c-urls a:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.company-card .c-note{font-size:12px;color:var(--text-muted);margin-top:6px}
.company-card .c-actions{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-subtle)}

/* Report two-column */
.report-layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:1000px){.report-layout{grid-template-columns:1fr}}
.report-sidebar{position:sticky;top:80px}

/* Health mini-panel inside companies tab */
.health-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.health-strip .hs-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:14px 18px;text-align:center;transition:all var(--transition);cursor:pointer}
.health-strip .hs-card:hover{box-shadow:var(--shadow-hover)}
.hs-card .hs-num{font-family:var(--font-mono);font-size:26px;font-weight:700}
.hs-card .hs-label{font-size:11px;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.hs-card.hs-total{border-left:3px solid var(--primary)}
.hs-card.hs-pending{border-left:3px solid var(--yellow)}
.hs-card.hs-blocked{border-left:3px solid var(--red)}
.hs-card.hs-failed{border-left:3px solid var(--text-muted)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:999;display:flex;align-items:flex-start;justify-content:center;padding-top:80px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);border-radius:14px;width:560px;max-width:94vw;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-modal);animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border-light);position:sticky;top:0;background:var(--surface);z-index:1;border-radius:14px 14px 0 0}
.modal-body{padding:24px}
.modal-body label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;margin-top:12px;text-transform:uppercase;letter-spacing:.4px}
.modal-body label:first-child{margin-top:0}
.modal-body .hint{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Tooltip */
.tooltip-wrap{position:relative;display:inline-flex;align-items:center}
.tooltip-trigger{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--muted);color:var(--text-muted);font-size:11px;font-weight:700;cursor:help;border:none;transition:all var(--transition)}
.tooltip-trigger:hover{background:var(--primary);color:#fff}
.tooltip-box{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.6;white-space:normal;width:260px;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none}
.tooltip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--text)}
.tooltip-wrap:hover .tooltip-box{display:block}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-ok{background:var(--green-bg);color:var(--green)}
.badge-warn{background:var(--yellow-bg);color:var(--yellow)}
.badge-err{background:var(--red-bg);color:var(--red)}
.badge-info{background:var(--primary-bg);color:var(--primary)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all var(--transition);white-space:nowrap;letter-spacing:.2px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(30,64,175,.25)}
.btn-primary:hover{background:#1E3A8A;box-shadow:0 2px 6px rgba(30,64,175,.35)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text-secondary)}
.btn-outline:hover{background:var(--muted);color:var(--text);border-color:var(--primary-light)}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:4px 10px;font-size:11px}

/* Toggle */
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.toggle input{display:none}
.toggle-track{width:38px;height:21px;background:#CBD5E1;border-radius:10px;position:relative;transition:background var(--transition)}
.toggle input:checked+.toggle-track{background:var(--green)}
.toggle-track::after{content:'';position:absolute;width:17px;height:17px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform var(--transition);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.toggle input:checked+.toggle-track::after{transform:translateX(17px)}

/* Table rows */
.row{display:grid;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-subtle);gap:12px;font-size:13px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg);margin:0 -20px;padding-left:20px;padding-right:20px}

/* Forms */
input[type="text"],input[type="url"],input[type="password"],input[type="search"],select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;background:var(--bg);color:var(--text);transition:all var(--transition)}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.search-bar{position:relative}
.search-bar input{padding-left:34px}
.search-bar::before{content:'\1F50D';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none}

/* Upload */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:all var(--transition);color:var(--text-muted);background:var(--bg)}
.upload-zone:hover{border-color:var(--primary-light);background:var(--primary-bg);color:var(--primary)}
.upload-zone.drag-over{border-color:var(--primary);background:var(--primary-bg)}

/* Markdown */
.markdown-body{font-size:14px;line-height:1.85;color:var(--text)}
.markdown-body h1{font-size:20px;margin:16px 0 8px;color:var(--primary);font-family:var(--font-mono)}
.markdown-body h2{font-size:16px;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.markdown-body h3{font-size:14px;margin:14px 0 6px}
.markdown-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.markdown-body th,.markdown-body td{border:1px solid var(--border-light);padding:7px 12px;text-align:left}
.markdown-body th{background:var(--primary-bg);font-weight:600;font-size:12px}
.markdown-body code{font-family:var(--font-mono);font-size:12px;background:var(--muted);padding:2px 5px;border-radius:3px}
.markdown-body pre{background:var(--bg);border:1px solid var(--border);padding:14px;overflow-x:auto;font-size:12px;line-height:1.6;border-radius:var(--radius-sm)}
.markdown-body a{color:var(--primary);text-decoration:underline}
.markdown-body hr{margin:18px 0;border:none;border-top:1px solid var(--border)}
.markdown-body strong{color:var(--text)}

@media(max-width:768px){header{padding:0 12px}header h1{font-size:14px}nav button{padding:6px 10px;font-size:11px}main{padding:12px}.company-grid{grid-template-columns:1fr}}

.text-muted{color:var(--text-muted)}.text-sm{font-size:12px}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}.gap-1{gap:4px}.gap-2{gap:8px}.flex-wrap{flex-wrap:wrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
code{font-family:var(--font-mono);font-size:12px;background:var(--muted);padding:1px 5px;border-radius:3px;color:var(--primary)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;animation:toastIn .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.15)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.checkbox{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.kw-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--accent-bg);color:var(--accent);margin:1px 2px}
</style>
</head>
<body>

<header>
  <h1>&#x1f3af; SmartJobHunter <span>Console</span></h1>
  <nav id="tabs">
    <button class="active" data-tab="strategy">&#x2699;&#xfe0f; 公司与策略</button>
    <button data-tab="resumes">&#x1f4c4; 简历管理</button>
    <button data-tab="tasks">&#x1f4ca; 任务与结果</button>
  </nav>
</header>

<main id="content"></main>

<script>
const $=(s,c)=>(c||document).querySelector(s);
const $$=(s,c)=>[...(c||document).querySelectorAll(s)];

async function api(path,opts={}){
  const res=await fetch(path,{headers:opts.body instanceof FormData?{}:{'Content-Type':'application/json'},...opts});
  if(!res.ok){const msg=await res.text().catch(()=>'');throw new Error(msg||`${res.status}`)}
  const ct=res.headers.get('content-type')||'';
  return ct.includes('application/json')?res.json():res.text();
}
function toast(m){const el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
function fs(b){return b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const LABEL={'social':'社招','campus':'校招','internship':'实习'};

// ── Tab routing ──
const renderers={};
function loadTab(n){const f=renderers[n];if(f)f()}
$$('nav button').forEach(b=>b.addEventListener('click',()=>{$$('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadTab(b.dataset.tab)}));

// ── Modal helper ──
function showModal(title,bodyHtml,width='560px'){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-box" style="width:${width}"><div class="modal-header"><h3 style="font-family:var(--font-mono);font-size:13px;color:var(--primary);letter-spacing:.3px">${title}</h3><button class="btn btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove()">&#x2715; 关闭</button></div><div class="modal-body">${bodyHtml}</div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
}

// ══════════════════════════════════════════════
// Tab 1: 公司与策略 (companies + health)
// ══════════════════════════════════════════════
let _coData=[],_healthData=null,_coFilter='all',_selCompanies=new Set();
renderers.strategy=async()=>{
  const[companies,health]=await Promise.all([api('/api/companies'),api('/api/health')]);
  _coData=companies;_healthData=health;_selCompanies=new Set();
  const sorted=_sortCompanies(companies,_coFilter);
  document.getElementById('content').innerHTML='<div id="companyGridSection"></div><div id="healthPanel"></div>';
  renderCompanyGrid(sorted);
  renderHealthPanel(health);
};

function _sortCompanies(list,filter){
  let out=[...list];
  if(filter==='enabled') out.sort((a,b)=>(b.enabled-a.enabled)||a.name.localeCompare(b.name,'zh'));
  else if(filter==='all') out.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else if(filter==='disabled') out.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  return out;
}

function renderHealthPanel(health){
  const s=health.summary||{total:0,pending:0,blocked:0,failed:0};
  const statusClass=st=>st==='blocked'?'badge-err':st==='pending'?'badge-warn':st==='repaired'?'badge-ok':'badge-info';
  const statusLabel=st=>({pending:'待处理',blocked:'阻塞',failed:'失败',repaired:'已修复'}[st]||st);
  const wrap=document.getElementById('healthPanel');
  if(!wrap)return;
  if(s.total===0){
    wrap.innerHTML=`<div class="card"><div class="card-header"><h3>&#x1fa79; 策略健康</h3><button class="btn btn-outline btn-sm" onclick="refreshHealth()">&#x21bb; 刷新</button></div><div class="empty-state">&#x2705; 所有已启用公司抓取策略正常</div></div>`;
    return;
  }
  let h=`<div class="card"><div class="card-header"><h3>&#x1fa79; 策略健康</h3><div class="flex gap-2"><button class="btn btn-outline btn-sm" onclick="window._selectAllHealth()">全选</button><button class="btn btn-outline btn-sm" onclick="window._clearHealthSel()">取消</button><button class="btn btn-primary btn-sm" id="batchRepairBtn" disabled onclick="batchRepair()">&#x1f6e0; 批量修复 (0)</button><button class="btn btn-outline btn-sm" onclick="refreshHealth()">&#x21bb; 刷新</button></div></div>`;
  h+=`<div class="health-strip"><div class="hs-card hs-total"><div class="hs-num" style="color:var(--primary)">${s.total}</div><div class="hs-label">总异常</div></div><div class="hs-card hs-pending"><div class="hs-num" style="color:var(--yellow)">${s.pending}</div><div class="hs-label">待处理</div></div><div class="hs-card hs-blocked"><div class="hs-num" style="color:var(--red)">${s.blocked}</div><div class="hs-label">阻塞</div></div><div class="hs-card hs-failed"><div class="hs-num" style="color:var(--text-muted)">${s.failed}</div><div class="hs-label">失败</div></div></div>`;
  for(const t of health.tasks){
    h+=`<div class="row" style="grid-template-columns:auto 1fr auto auto"><input type="checkbox" class="checkbox hc-cb" data-cid="${esc(t.company_id)}" onchange="toggleHcSel('${esc(t.company_id)}',this.checked)"><div><strong>${esc(t.company_name)}</strong> <span class="badge ${statusClass(t.status)}">${statusLabel(t.status)}</span><div class="text-sm mt-1" style="color:var(--text-secondary)">${esc(t.reason_label||t.reason)}</div></div><span class="text-muted text-sm">${(t.created_at||'').slice(0,16)}</span><button class="btn btn-outline btn-sm" onclick="retryOne('${esc(t.company_id)}')">&#x1f6e0; 重试</button></div>`;
  }
  h+=`</div>`;
  wrap.innerHTML=h;
}
window.refreshHealth=async()=>{const h=await api('/api/health');_healthData=h;renderHealthPanel(h);renderCompanyGrid(_sortCompanies(_coData,_coFilter))};
window._selectAllHealth=()=>{if(!_healthData)return;const ids=_healthData.tasks.map(t=>t.company_id);_selCompanies=new Set(ids);$$('.hc-cb').forEach(cb=>{cb.checked=true});updateBatchBtn()};
window._clearHealthSel=()=>{_selCompanies.clear();$$('.hc-cb').forEach(cb=>{cb.checked=false});updateBatchBtn()};
window.toggleHcSel=(cid,checked)=>{if(checked)_selCompanies.add(cid);else _selCompanies.delete(cid);updateBatchBtn()};
window.updateBatchBtn=()=>{const b=$('#batchRepairBtn');if(b){b.disabled=_selCompanies.size===0;b.textContent=`批量修复 (${_selCompanies.size})`}};
window.batchRepair=async()=>{if(_selCompanies.size===0)return;const n=_selCompanies.size;if(!confirm(`确认对 ${n} 家公司执行策略巡检？后台运行，完成后刷新。`))return;await api('/api/health/repair',{method:'POST',body:JSON.stringify({company_ids:[..._selCompanies],keyword:'',job_type:'social'})});toast(`已触发 ${n} 家公司后台巡检`);_selCompanies.clear();updateBatchBtn()};
window.retryOne=async(id)=>{try{const r=await api(`/api/companies/${id}/test`,{method:'POST',body:JSON.stringify({keyword:'',job_type:'social'})});toast(r.ok?`${id}: ${r.jobs_count} 岗位`:`${id}: 测试失败`);await refreshHealth()}catch(e){toast('重试失败: '+e.message)}};

function renderCompanyGrid(companies){
  // Build health lookup from _healthData
  const healthMap={};if(_healthData)for(const t of _healthData.tasks||[]){healthMap[t.company_id]=t}
  const searchHtml=`<div class="card"><div class="flex-between flex-wrap gap-2"><div class="flex gap-2" style="align-items:center"><button class="btn btn-primary" onclick="showAddModal()">+ 新增公司</button><select id="coFilter" onchange="_coFilter=this.value;applyCoFilters()" style="width:auto;padding:9px 12px"><option value="all">全部</option><option value="enabled">已启用</option><option value="disabled">已禁用</option></select></div><div class="search-bar" style="width:260px"><input type="search" id="coSearch" placeholder="搜索公司..." oninput="applyCoFilters()"></div></div></div>`;
  const coHtml=`
    <div class="company-grid">
      ${companies.map(c=>{
        const urlKeys=Object.keys(c.urls||{}).filter(k=>c.urls[k]);
        const h=healthMap[c.id];
        const hBadge=h?`<span class="badge ${h.status==='blocked'?'badge-err':h.status==='pending'?'badge-warn':'badge-info'}" title="${esc(h.reason_label||h.reason||'')}">&#x1fa79; ${({pending:'待修复',blocked:'阻塞',failed:'失败',repaired:'已修复'}[h.status]||h.status)}</span>`:'';
        return `
        <div class="company-card ${c.enabled?'':'disabled'}" data-cid="${esc(c.id)}" data-search="${esc(c.name+' '+c.id)}" data-enabled="${c.enabled?'1':'0'}">
          <div class="c-top">
            <div class="c-name">
              <span>${esc(c.name)}</span><code style="font-size:11px">${esc(c.id)}</code>
              <span class="badge ${c.enabled?'badge-ok':'badge-warn'}">${c.enabled?'已启用':'已禁用'}</span>
              ${c.strategy_type!=='unknown'?`<span class="badge badge-info">${esc(c.strategy_type)}</span>`:''}
              ${hBadge}
            </div>
            <label class="toggle"><input type="checkbox" ${c.enabled?'checked':''} onchange="toggleCo('${esc(c.id)}',this.checked)"><div class="toggle-track"></div></label>
          </div>
          ${urlKeys.length?`<div class="c-urls">${urlKeys.map(k=>`<a href="${esc(c.urls[k])}" target="_blank" rel="noopener" title="${esc(c.urls[k])}">${LABEL[k]||k}</a>`).join('')}</div>`:''}
          ${c.note?`<div class="c-note">${esc(c.note)}</div>`:''}
          <div class="c-actions">
            <button class="btn btn-outline btn-sm" onclick="showEditModal('${esc(c.id)}')">&#x270f; 编辑</button>
            <button class="btn btn-outline btn-sm" onclick="testCo('${esc(c.id)}')">&#x1f9ea; 测试</button>
            <button class="btn btn-danger btn-sm" onclick="deleteCo('${esc(c.id)}')">&#x1f5d1; 删除</button>
            <span id="test-${esc(c.id)}" class="text-sm" style="margin-left:auto"></span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  const gridEl=document.getElementById('companyGridSection');
  if(!gridEl)return;
  gridEl.innerHTML=searchHtml+coHtml;
  $('#coFilter').value=_coFilter;
}
window.applyCoFilters=()=>{
  const q=$('#coSearch')?.value?.toLowerCase()||'';
  const filter=_coFilter;
  let sorted=_sortCompanies(_coData,filter);
  $$('.company-card').forEach(c=>{
    const matchSearch=!q||c.dataset.search.toLowerCase().includes(q);
    const matchFilter=filter==='all'||(filter==='enabled'&&c.dataset.enabled==='1')||(filter==='disabled'&&c.dataset.enabled==='0');
    c.style.display=(matchSearch&&matchFilter)?'':'none';
  });
};

window.filterCompanies=window.applyCoFilters;
window.toggleCo=async(id,en)=>{await api(`/api/companies/${id}`,{method:'PUT',body:JSON.stringify({enabled:en})});const c=_coData.find(x=>x.id===id);if(c)c.enabled=en;applyCoFilters();toast(en?'已启用 '+id:'已禁用 '+id)};
window.testCo=async(id)=>{const el=$(`#test-${id}`);el.innerHTML='<span class="spinner"></span>';try{const r=await api(`/api/companies/${id}/test`,{method:'POST',body:JSON.stringify({keyword:'',job_type:'social'})});el.innerHTML=r.ok?`<span style="color:var(--green)">&#x2705; ${r.jobs_count}岗</span>`:`<span style="color:var(--red)">&#x274c; 失败</span>`;if(!r.ok){el.innerHTML+=` <span class="text-sm text-muted">${esc((r.error||'').substring(0,60))}</span>`;await refreshHealth()}}catch(e){el.innerHTML=`<span style="color:var(--red)">&#x274c;</span>`;await refreshHealth()}};
window.deleteCo=async(id)=>{if(!confirm(`确定删除 "${id}"？此操作不可恢复。`))return;await api(`/api/companies/${id}`,{method:'DELETE'});toast('已删除 '+id);renderers.strategy()};

window.showAddModal=()=>{showModal('新增公司',`
  <label>公司 ID <span class="text-muted">(英文标识)</span></label><input id="mId" placeholder="例: mycompany">
  <label>公司名称</label><input id="mName" placeholder="例: 我的公司">
  <label>社招 URL</label><input id="mUrlS" placeholder="https://...">
  <label>校招 URL</label><input id="mUrlC" placeholder="https://...">
  <label>实习 URL</label><input id="mUrlI" placeholder="https://...">
  <label>策略类型</label><select id="mStrat"><option value="">待定 (后续Agent分析)</option><option value="config_intercept">config_intercept (API拦截)</option><option value="config_dom">config_dom (DOM解析)</option><option value="custom_python">custom_python (专用策略)</option></select>
  <label>备注</label><input id="mNote" placeholder="可选">
  <div class="mt-3 flex gap-2"><button class="btn btn-primary" onclick="createCo()">确认创建</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button></div>
`)};

window.createCo=async()=>{
  const body={id:$('#mId').value.trim(),name:$('#mName').value.trim(),enabled:false,urls:{social:$('#mUrlS').value.trim(),campus:$('#mUrlC').value.trim(),internship:$('#mUrlI').value.trim()},note:$('#mNote').value.trim(),strategy_type:$('#mStrat').value};
  if(!body.id||!body.name)return toast('ID 和名称不能为空');
  try{await api('/api/companies',{method:'POST',body:JSON.stringify(body)});document.querySelector('.modal-overlay')?.remove();toast('已创建 '+body.id);renderers.strategy()}catch(e){toast('创建失败: '+e.message)}
};

window.showEditModal=(id)=>{
  const c=_coData.find(x=>x.id===id);if(!c)return;
  showModal(`编辑: ${esc(c.name)}`,`
    <label>公司名称</label><input id="eName" value="${esc(c.name)}">
    <label>社招 URL</label><input id="eUrlS" value="${esc(c.urls?.social||'')}">
    <label>校招 URL</label><input id="eUrlC" value="${esc(c.urls?.campus||'')}">
    <label>实习 URL</label><input id="eUrlI" value="${esc(c.urls?.internship||'')}">
    <label>备注</label><input id="eNote" value="${esc(c.note||'')}">
    <div class="mt-3 flex gap-2"><button class="btn btn-primary" onclick="saveCo('${esc(id)}')">保存</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button></div>
  `);
};

window.saveCo=async(id)=>{
  const body={name:$('#eName').value.trim(),note:$('#eNote').value.trim(),urls:{social:$('#eUrlS').value.trim(),campus:$('#eUrlC').value.trim(),internship:$('#eUrlI').value.trim()}};
  await api(`/api/companies/${id}`,{method:'PUT',body:JSON.stringify(body)});document.querySelector('.modal-overlay')?.remove();toast('已保存');renderers.strategy();
};

// ══════════════════════════════════════════════
// Tab 2: 简历管理
// ══════════════════════════════════════════════
renderers.resumes=async()=>{
  const data=await api('/api/resumes');
  const html=`
    <div class="card"><div class="card-header"><h3>上传简历</h3></div>
      <div class="upload-zone" id="dropZone"><div style="font-size:32px;margin-bottom:8px">&#x1f4c4;</div><div>拖拽文件到此，或点击选择</div><div class="text-sm text-muted mt-2">支持 .txt .md .docx .pdf .png .jpg，最大 10MB</div><input type="file" id="resumeInput" accept=".txt,.md,.docx,.pdf,.png,.jpg,.jpeg" multiple style="display:none"></div>
      <div id="uploadStatus" class="mt-2 text-sm"></div>
    </div>
    <div class="card"><div class="card-header"><h3>已上传 (${data.length} 个文件)</h3></div>
      ${data.length===0?`<div class="empty-state">暂无简历文件。上传第一份简历开始使用。</div>`:data.map(f=>`
        <div class="row" style="grid-template-columns:1fr auto auto auto">
          <div><span>&#x1f4c4; ${esc(f.name)}</span><span class="text-muted text-sm" style="margin-left:12px">${fs(f.size)} · ${(f.modified||'').slice(0,10)}</span></div>
          <span class="badge badge-info">${esc(f.format)}</span>
          <button class="btn btn-outline btn-sm" onclick="previewResume('${esc(f.name)}')">&#x1f441; 预览</button>
          <button class="btn btn-danger btn-sm" onclick="deleteResume('${esc(f.name)}')">删除</button>
        </div>
      `).join('')}
    </div>`;
  document.getElementById('content').innerHTML=html;
  const zone=$('#dropZone'),input=$('#resumeInput');
  zone.addEventListener('click',()=>input.click());
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');uploadFiles(e.dataTransfer.files)});
  input.addEventListener('change',()=>uploadFiles(input.files));
};

async function uploadFiles(files){const s=$('#uploadStatus');for(const f of files){s.innerHTML=`<span class="spinner"></span> 上传: ${esc(f.name)}...`;const fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/resumes',{method:'POST',body:fd}).then(r=>r.json());s.innerHTML=r.ok?`&#x2705; ${esc(f.name)} 上传成功`:`&#x274c; 失败`;if(r.referenced_by?.length)s.innerHTML+=` (关联: ${r.referenced_by.join(', ')})`}catch(e){s.innerHTML=`&#x274c; ${esc(e.message)}`}}setTimeout(()=>renderers.resumes(),800)}
window.previewResume=async(n)=>{try{const r=await api(`/api/resumes`);const f=r.find(x=>x.name===n);if(!f)return;const txt=f.format==='pdf'||f.format==='docx'?'(二进制文件，无法在线预览)':await fetch(`/resumes/${encodeURIComponent(n)}`).then(r=>r.text());showModal(`&#x1f4c4; ${esc(n)}`,f.format==='md'?`<div class="markdown-body">${marked.parse(txt)}</div>`:`<pre style="white-space:pre-wrap;font-size:13px;max-height:60vh;overflow-y:auto">${esc(txt)}</pre>`,'700px')}catch(e){toast('预览失败: '+e.message)}};
window.deleteResume=async(n)=>{if(!confirm(`删除 "${n}"？`))return;const r=await api(`/api/resumes/${encodeURIComponent(n)}`,{method:'DELETE'});if(r.warnings?.length)toast('&#x26a0; '+r.warnings.join('; '));renderers.resumes()};

// ══════════════════════════════════════════════
// Tab 3: 任务与结果
// ══════════════════════════════════════════════
renderers.tasks=async()=>{
  const[cfg,reports]=await Promise.all([api('/api/config'),api('/api/reports')]);
  const rptByProfile={};for(const r of reports){const k=r.profile||'未知';if(!rptByProfile[k])rptByProfile[k]=[];rptByProfile[k].push(r)}
  const fs=cfg.feishu||{};
  let sidebarHtml='<div class="card"><div class="card-header"><h3>&#x1f4e1; 飞书推送 <span class="tooltip-wrap" style="margin-left:6px"><button class="tooltip-trigger">?</button><div class="tooltip-box">在飞书开放平台创建企业自建应用 → 获取 App ID 和 App Secret → 开启机器人能力 → 在知识库中创建知识空间获取 Wiki Token → 在多维表格中获取 Bitable Token 和 Table ID。填入后开启推送开关即可。</div></span></h3></div>';
  sidebarHtml+=`<label class="toggle" style="margin-bottom:14px"><input type="checkbox" ${fs.enabled?"checked":""} onchange="toggleFs(this.checked)"><div class="toggle-track"></div><span>${fs.enabled?"推送已开启":"推送已关闭"}</span></label>`;
  sidebarHtml+='<details style="margin-top:8px"><summary class="text-sm" style="cursor:pointer;color:var(--text-secondary);font-weight:500">编辑凭证</summary><div style="margin-top:10px">';
  sidebarHtml+=`<label class="text-sm">App ID</label><input id="fsAppId" value="${esc(fs.app_id||"")}" placeholder="飞书应用 App ID" style="margin-bottom:8px">`;
  sidebarHtml+=`<label class="text-sm">App Secret</label><input id="fsAppSecret" type="password" value="${esc(fs.app_secret||"")}" placeholder="飞书应用 Secret" style="margin-bottom:8px">`;
  sidebarHtml+=`<label class="text-sm">Wiki Node Token</label><input id="fsWiki" value="${esc(fs.wiki_node_token||"")}" placeholder="知识库节点 Token" style="margin-bottom:8px">`;
  sidebarHtml+=`<label class="text-sm">Bitable Token</label><input id="fsBitable" value="${esc(fs.bitable_token||"")}" placeholder="多维表格 Token" style="margin-bottom:8px">`;
  sidebarHtml+=`<label class="text-sm">Bitable Table ID</label><input id="fsTableId" value="${esc(fs.bitable_table_id||"")}" placeholder="表格 ID">`;
  sidebarHtml+='<button class="btn btn-primary btn-sm mt-2" onclick="saveFs()">保存配置</button></div></details></div>';
  sidebarHtml+='<div class="card"><div class="card-header"><h3>&#x1f916; 求职意向</h3></div>';
  for(const p of cfg.profiles||[]){
    const cnt=(rptByProfile[p.name]||[]).length;
    sidebarHtml+=`<div class="row" style="grid-template-columns:1fr auto auto"><div><div class="flex gap-1" style="align-items:center;flex-wrap:wrap"><strong>${esc(p.name)}</strong><code>${esc(p.job_type||"")}</code>`;
    if(p.keywords)for(const k of p.keywords)sidebarHtml+=`<span class="kw-tag">${esc(k)}</span>`;
    sidebarHtml+=`</div>${p.resume?`<div class="text-sm text-muted mt-1">&#x1f4ce; ${esc(p.resume)}</div>`:""}</div><div class="flex gap-1" style="align-items:center">`;
    if(p.resume)sidebarHtml+=`<button class="btn btn-outline btn-sm" onclick="viewProfileResume('${esc(p.name)}')">简历</button>`;
    sidebarHtml+=`<label class="toggle"><input type="checkbox" ${p.enabled?"checked":""} onchange="togglePf('${esc(p.name)}',this.checked)"><div class="toggle-track"></div></label></div></div>`;
  }
  sidebarHtml+='</div><button class="btn btn-primary" style="width:100%" onclick="toast(\'请在终端运行: python -m src.cli\')">&#x25b6; 立即巡检</button><div class="text-sm text-muted mt-1" style="text-align:center">运行 python -m src.cli 并刷新此页查看结果</div>';

  let mainHtml=`<div class="card"><div class="card-header"><h3>&#x1f4c4; 巡检报告</h3><span class="text-sm text-muted">${reports.length} 份报告</span></div>`;
  if(reports.length===0){
    mainHtml+='<div class="empty-state">暂无报告。<br>启用意向后运行 <code>python -m src.cli</code></div>';
  }else{
    const entries=Object.entries(rptByProfile);
    for(const[profile,items]of entries){
      mainHtml+=`<div style="margin-bottom:14px"><div class="text-sm" style="font-weight:600;color:var(--text-secondary);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border-subtle)">&#x1f4cc; ${esc(profile)} · ${items.length} 份</div>`;
      for(const r of items){
        mainHtml+=`<div class="row" style="grid-template-columns:1fr auto;cursor:pointer" onclick="viewReport('${esc(r.relpath)}')"><div><strong>${esc(r.generated||r.modified?.slice(0,10)||"")}</strong><span class="text-muted text-sm" style="margin-left:8px">${r.job_count} 岗位 · 最高 ${r.top_score} 分</span></div><span class="text-sm text-muted">${fs(r.size)}</span></div>`;
      }
      mainHtml+='</div>';
    }
  }
  mainHtml+='</div><div id="reportDetail"></div>';
  document.getElementById('content').innerHTML=`<div class="report-layout"><div class="report-sidebar">${sidebarHtml}</div><div>${mainHtml}</div></div>`;
};

window.toggleFs=async(en)=>{await api('/api/config',{method:'PUT',body:JSON.stringify({feishu:{enabled:en}})});toast(en?'飞书推送已开启':'飞书推送已关闭')};
window.togglePf=async(n,en)=>{await api('/api/config',{method:'PUT',body:JSON.stringify({profiles:[{name:n,enabled:en}]})});toast(`${n} ${en?'已启用':'已禁用'}`)};
window.saveFs=async()=>{const b={feishu:{app_id:$('#fsAppId').value.trim(),app_secret:$('#fsAppSecret').value.trim(),wiki_node_token:$('#fsWiki').value.trim(),bitable_token:$('#fsBitable').value.trim(),bitable_table_id:$('#fsTableId').value.trim()}};await api('/api/config',{method:'PUT',body:JSON.stringify(b)});toast('飞书配置已保存')};
window.runInspect=()=>{toast('请在终端运行: python -m src.cli')};
window.viewProfileResume=async(n)=>{try{const r=await api(`/api/profiles/${encodeURIComponent(n)}/resume`);showModal(`&#x1f4c4; ${n} — ${esc(r.filename)}`,r.format==='md'?`<div class="markdown-body">${marked.parse(r.content)}</div>`:`<pre style="white-space:pre-wrap;font-size:13px;max-height:60vh;overflow-y:auto">${esc(r.content)}</pre>`,'700px')}catch(e){toast('无法加载: '+e.message)}};
window.viewReport=async(rp)=>{const md=await api('/api/reports/'+encodeURIComponent(rp));$('#reportDetail').innerHTML=`<div class="card"><div class="card-header"><h3>&#x1f4c4; ${esc(rp)}</h3><button class="btn btn-outline btn-sm" onclick="this.closest('#reportDetail').innerHTML=''">关闭</button></div><div class="markdown-body">${marked.parse(md)}</div></div>`;$('#reportDetail').scrollIntoView({behavior:'smooth'})};

// ── Init ──
loadTab('strategy');
</script>
