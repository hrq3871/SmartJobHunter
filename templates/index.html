<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartJobHunter Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.7/dist/docx-preview.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg:#F8FAFC; --surface:#FFF; --primary:#1D4ED8; --primary-light:#3B82F6;
  --primary-bg:#EEF2FF; --accent:#B45309; --accent-bg:#FFFBEB;
  --text:#0F172A; --text-secondary:#475569; --text-muted:#94A3B8;
  --border:#E2E8F0; --border-light:#F1F5F9;
  --muted:#F1F5F9;
  --green:#15803D; --green-bg:#F0FDF4; --red:#B91C1C; --red-bg:#FEF2F2;
  --yellow:#A16207; --yellow-bg:#FEFCE8;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --font-mono:'Fira Code','Consolas',monospace; --font-sans:'Fira Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius:8px; --radius-sm:6px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── Header ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
header h1{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent);font-weight:500}

/* ── Navigation ── */
nav{display:flex;gap:2px}
nav button{background:transparent;color:var(--text-secondary);border:none;padding:6px 16px;cursor:pointer;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s,color .15s;display:flex;align-items:center;gap:6px;position:relative}
nav button:hover{background:var(--muted);color:var(--text)}
nav button.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
nav button.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--primary);border-radius:1px}
.sub-tab{font-size:13px;padding:5px 16px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-family:var(--font-sans)}
.sub-tab:hover{background:var(--primary-bg);color:var(--primary)}
.sub-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}

/* ── Layout ── */
main{max-width:1400px;margin:0 auto;padding:24px}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-header h3{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-secondary);letter-spacing:.4px}

/* ── Company Grid ── */
.company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px}
.company-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--surface)}
.company-card.disabled{opacity:.55;background:var(--border-light)}
.company-card .c-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.company-card .c-name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.4}
.company-card .c-urls{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.company-card .c-urls a{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;text-decoration:none;background:var(--primary-bg);color:var(--primary);border:1px solid transparent;transition:background .15s,color .15s}
.company-card .c-urls a:hover{background:var(--primary);color:#fff}
.company-card .c-note{font-size:11px;color:var(--text-muted);margin-top:4px}
.company-card .c-actions{display:flex;gap:4px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

/* ── Report Layout ── */
.report-layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.report-layout{grid-template-columns:1fr}}
.report-sidebar{position:sticky;top:68px}

/* ── Health Strip ── */
.health-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.hs-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;text-align:center}
.hs-card .hs-num{font-family:var(--font-mono);font-size:24px;font-weight:700}
.hs-card .hs-label{font-size:11px;color:var(--text-muted);margin-top:2px}
.hs-card.hs-total{border-left:3px solid var(--primary)}
.hs-card.hs-pending{border-left:3px solid var(--yellow)}
.hs-card.hs-blocked{border-left:3px solid var(--red)}
.hs-card.hs-failed{border-left:3px solid var(--text-muted)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:999;display:flex;align-items:flex-start;justify-content:center;padding-top:64px}
.modal-box{background:var(--surface);border-radius:12px;width:520px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;border-radius:12px 12px 0 0}
.modal-header h3{font-family:var(--font-mono);font-size:13px;color:var(--primary)}
.modal-body{padding:20px}
.modal-body label,label.form-label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:3px;margin-top:12px;letter-spacing:.3px}
.modal-body label:first-child,label.form-label:first-child{margin-top:0}

/* ── Tooltip ── */
.tooltip-wrap{position:relative;display:inline-flex;align-items:center}
.tooltip-trigger{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--border);color:var(--text-muted);font-size:10px;font-weight:700;cursor:help;border:none;transition:background .15s,color .15s}
.tooltip-trigger:hover{background:var(--primary);color:#fff}
.tooltip-box{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 12px;border-radius:6px;font-size:11px;line-height:1.5;width:240px;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.15);pointer-events:none}
.tooltip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--text)}
.tooltip-wrap:hover .tooltip-box{display:block}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:.2px}
.badge-ok{background:var(--green-bg);color:var(--green)}
.badge-warn{background:var(--yellow-bg);color:var(--yellow)}
.badge-err{background:var(--red-bg);color:var(--red)}
.badge-info{background:var(--primary-bg);color:var(--primary)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s,color .15s,opacity .15s;white-space:nowrap;line-height:1.4}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#1E40AF}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text-secondary)}
.btn-outline:hover{background:var(--muted);color:var(--text)}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:3px 10px;font-size:11px}

/* ── Toggle ── */
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}
.toggle input{display:none}
.toggle-track{width:34px;height:20px;background:#CBD5E1;border-radius:10px;position:relative;transition:background .15s}
.toggle input:checked+.toggle-track{background:var(--green)}
.toggle-track::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toggle input:checked+.toggle-track::after{transform:translateX(14px)}

/* ── Rows ── */
.row{display:grid;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);gap:12px;font-size:13px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg)}

/* ── Forms ── */
input[type="text"],input[type="url"],input[type="password"],input[type="search"],select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;background:var(--surface);color:var(--text);transition:border-color .15s}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.search-bar{position:relative}
.search-bar input{padding-left:30px}
.search-bar::before{content:'\1F50D';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.4;pointer-events:none}

/* ── Upload Zone ── */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;color:var(--text-muted);background:var(--bg)}
.upload-zone:hover{border-color:var(--primary-light);background:var(--primary-bg);color:var(--primary)}
.upload-zone.drag-over{border-color:var(--primary);background:var(--primary-bg)}

/* ── Markdown ── */
.markdown-body{font-size:14px;line-height:1.8;color:var(--text)}
.markdown-body h1{font-size:18px;margin:12px 0 8px;color:var(--primary);font-family:var(--font-mono)}
.markdown-body h2{font-size:15px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.markdown-body h3{font-size:13px;margin:12px 0 4px}
.markdown-body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.markdown-body th{background:var(--primary-bg);font-weight:600}
.markdown-body code{font-family:var(--font-mono);font-size:11px;background:var(--muted);padding:2px 4px;border-radius:2px}
.markdown-body pre{background:var(--bg);border:1px solid var(--border);padding:12px;overflow-x:auto;font-size:12px;line-height:1.6;border-radius:var(--radius-sm)}
.markdown-body a{color:var(--primary)}
.markdown-body hr{margin:16px 0;border:none;border-top:1px solid var(--border)}

@media(max-width:768px){header{padding:0 12px}header h1{font-size:14px}nav button{padding:4px 8px;font-size:11px}main{padding:12px}.company-grid{grid-template-columns:1fr}.company-card .c-actions{flex-wrap:wrap}}

/* ── Utilities ── */
.text-muted{color:var(--text-muted)}.text-sm{font-size:12px}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}.gap-1{gap:4px}.gap-2{gap:8px}.flex-wrap{flex-wrap:wrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
code{font-family:var(--font-mono);font-size:11px;background:var(--muted);padding:1px 4px;border-radius:2px;color:var(--primary)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:9999;animation:toastIn .2s ease;box-shadow:0 4px 16px rgba(0,0,0,.12)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.checkbox{width:14px;height:14px;accent-color:var(--primary);cursor:pointer;margin:0}
.empty-state{padding:32px 20px;text-align:center;color:var(--text-muted);font-size:13px}
.kw-tag{display:inline-block;padding:1px 6px;border-radius:8px;font-size:11px;background:var(--accent-bg);color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>&#x1f3af; SmartJobHunter <span>Console</span></h1>
  <nav id="tabs">
    <button class="active" data-tab="tasks">&#x1f4ca; 简历与巡检</button>
    <button data-tab="strategy">&#x2699;&#xfe0f; 公司与策略</button>
  </nav>
</header>

<main id="content"></main>

<script>
const $=(s,c)=>(c||document).querySelector(s);
const $$=(s,c)=>[...(c||document).querySelectorAll(s)];

async function api(path,opts={}){
  const res=await fetch(path,{headers:opts.body instanceof FormData?{}:{'Content-Type':'application/json'},...opts});
  if(!res.ok){const msg=await res.text().catch(()=>'');throw new Error(msg||`${res.status}`)}
  const ct=res.headers.get('content-type')||'';
  return ct.includes('application/json')?res.json():res.text();
}
function toast(m){const el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.remove(),2500)}
function fs(b){return b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const LABEL={'social':'社招','campus':'校招','internship':'实习'};

// ── Tab routing ──
const renderers={};
function loadTab(n){const f=renderers[n];if(!f)return;document.getElementById('content').innerHTML='<div class="empty-state"><span class="spinner"></span> 加载中...</div>';try{f()}catch(e){document.getElementById('content').innerHTML=`<div class="card" style="border-color:var(--red)"><h3>渲染错误</h3><p>${esc(e.message)}</p><pre class="text-sm" style="margin-top:8px">${esc(e.stack||'')}</pre></div>`}}
$$('nav button').forEach(b=>b.addEventListener('click',()=>{$$('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadTab(b.dataset.tab)}));

// ── Modal helper ──
function showModal(title,bodyHtml,width='560px'){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-box" style="width:${width}"><div class="modal-header"><h3 style="font-family:var(--font-mono);font-size:13px;color:var(--primary);letter-spacing:.3px">${title}</h3><button class="btn btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove()">&#x2715; 关闭</button></div><div class="modal-body">${bodyHtml}</div></div>`;
  document.body.appendChild(ov);
  // Prevent drag events from reaching upload zone behind modal
  ov.addEventListener('dragover',e=>e.preventDefault());
  ov.addEventListener('drop',e=>e.preventDefault());
}

// ══════════════════════════════════════════════
// Tab 1: 公司与策略 (sub-tabs: companies | health)
// ══════════════════════════════════════════════
let _coData=[],_healthData=null,_coFilter='all',_coHealthFilter='all',_selCompanies=new Set(),_strategySubTab='companies';
renderers.strategy=()=>{renderStrategyLayout()};

async function renderStrategyLayout(){
  const[companies,health]=await Promise.all([api('/api/companies'),api('/api/health')]);
  _coData=companies;_healthData=health;
  // Build sub-nav
  const html=`
    <div class="card" style="padding:8px 20px;margin-bottom:16px"><div style="display:flex;gap:8px;align-items:center">
      <button class="sub-tab ${_strategySubTab==='companies'?'active':''}" onclick="_strategySubTab='companies';renderStrategyContent()">&#x1f4cb; 公司列表 (${companies.length})</button>
      <button class="sub-tab ${_strategySubTab==='health'?'active':''}" onclick="_strategySubTab='health';renderStrategyContent()">&#x1fa79; 策略健康 (${health.summary.total})</button>
    </div></div>
    <div id="strategyContent"></div>`;
  document.getElementById('content').innerHTML=html;
  renderStrategyContent();
}
window.renderStrategyContent=()=>{
  const sc=document.getElementById('strategyContent');if(!sc)return;
  if(_strategySubTab==='health'){renderHealthPanel(_healthData);return}
  sc.innerHTML='';
  renderCompanyGrid(_sortCompanies(_coData,_coFilter));
};
window.switchStrategySubTab=(tab)=>{_strategySubTab=tab;renderStrategyLayout()};

function _sortCompanies(list,statusFilter){
  let out=[...list];
  out.sort((a,b)=>(b.enabled-a.enabled)||a.name.localeCompare(b.name,'zh'));
  // Status filter
  if(statusFilter==='enabled') out=out.filter(c=>c.enabled);
  else if(statusFilter==='disabled') out=out.filter(c=>!c.enabled);
  // Health filter (independent)
  if(_coHealthFilter==='pending'&&_healthData){
    const pendingIds=new Set((_healthData.tasks||[]).filter(t=>t.status==='pending').map(t=>t.company_id));
    out=out.filter(c=>pendingIds.has(c.id));
  }
  return out;
}

function renderHealthPanel(health){
  const s=health.summary||{total:0,pending:0,blocked:0,failed:0};
  const statusClass=st=>st==='blocked'?'badge-err':st==='pending'?'badge-warn':st==='repaired'?'badge-ok':'badge-info';
  const statusLabel=st=>({pending:'待处理',blocked:'阻塞',failed:'失败',repaired:'已修复'}[st]||st);
  const sc=document.getElementById('strategyContent');if(!sc)return;
  if(s.total===0){
    sc.innerHTML=`<div class="card"><div class="card-header"><h3>&#x1fa79; 策略健康</h3><button class="btn btn-outline btn-sm" onclick="refreshHealth()">&#x21bb; 刷新</button></div><div class="empty-state">&#x2705; 所有已启用公司抓取策略正常</div></div>`;
    return;
  }
  let h=`<div class="card"><div class="card-header"><h3>&#x1fa79; 策略健康</h3><button class="btn btn-outline btn-sm" onclick="refreshHealth()">&#x21bb; 刷新</button></div>`;
  h+=`<div class="health-strip"><div class="hs-card hs-total"><div class="hs-num" style="color:var(--primary)">${s.total}</div><div class="hs-label">总异常</div></div><div class="hs-card hs-pending"><div class="hs-num" style="color:var(--yellow)">${s.pending}</div><div class="hs-label">待处理</div></div><div class="hs-card hs-blocked"><div class="hs-num" style="color:var(--red)">${s.blocked}</div><div class="hs-label">阻塞</div></div><div class="hs-card hs-failed"><div class="hs-num" style="color:var(--text-muted)">${s.failed}</div><div class="hs-label">失败</div></div></div>`;
  h+=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="btn btn-outline btn-sm" onclick="window._selectAllHealth()">全选</button><button class="btn btn-outline btn-sm" onclick="window._clearHealthSel()">取消</button><button class="btn btn-primary btn-sm" id="batchRepairBtn" disabled onclick="batchRepair()">&#x1f6e0; 批量修复 (0)</button></div>`;
  for(const t of health.tasks){
    h+=`<div class="row" style="grid-template-columns:auto 1fr auto auto"><input type="checkbox" class="checkbox hc-cb" data-cid="${esc(t.company_id)}" onchange="toggleHcSel('${esc(t.company_id)}',this.checked)"><div><strong>${esc(t.company_name)}</strong> <span class="badge ${statusClass(t.status)}">${statusLabel(t.status)}</span><div class="text-sm mt-1" style="color:var(--text-secondary)">${esc(t.reason_label||t.reason)}</div></div><span class="text-muted text-sm">${(t.created_at||'').slice(0,16)}</span><button class="btn btn-outline btn-sm" onclick="retryOne('${esc(t.company_id)}')">&#x1f6e0; 重试</button></div>`;
  }
  h+=`</div>`;
  sc.innerHTML=h;
}
window.refreshHealth=async()=>{
  const h=await api('/api/health');_healthData=h;
  if(_strategySubTab==='health')renderHealthPanel(h);
  _updateCoHealthBadges();
  // Update sub-tab badge count
  const hbtn=document.querySelector('button[onclick*=\"_strategySubTab=\'health\'\"]');
  if(hbtn)hbtn.textContent=`\u{1fa79} 策略健康 (${h.summary.total})`;
};
window._updateCoHealthBadges=()=>{
  const map={};if(_healthData)for(const t of _healthData.tasks||[]){map[t.company_id]=t}
  $$('.company-card').forEach(card=>{
    const cid=card.dataset.cid;const h=map[cid];const badgeEl=card.querySelector('.health-badge');
    if(h){const label=({pending:'待修复',blocked:'阻塞',failed:'失败',repaired:'已修复'}[h.status]||h.status);const cls=h.status==='blocked'?'badge-err':h.status==='pending'?'badge-warn':'badge-info';
      if(badgeEl){badgeEl.className=`badge health-badge ${cls}`;badgeEl.textContent=`\u{1fa79} ${label}`;badgeEl.title=h.reason_label||h.reason||''}
      else{card.querySelector('.c-name').insertAdjacentHTML('beforeend',`<span class="badge health-badge ${cls}" title="${esc(h.reason_label||'')}">\u{1fa79} ${label}</span>`)}
    }else{if(badgeEl)badgeEl.remove()}
  });
};

  left+='<label class="form-label" style="margin-top:8px">Wiki 节点 Token</label>'+`<input id="fsWiki" value="${esc(fconf.wiki_node_token||"")}" style="margin-bottom:10px">`;
  left+='<label class="form-label" style="margin-top:8px">多维表格 Token</label>'+`<input id="fsBitable" value="${esc(fconf.bitable_token||"")}" style="margin-bottom:10px">`;

    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');doUpload(e.dataTransfer.files)});

function _findResumeForReport(report,profiles){
  if(!report.profile)return 'unknown';
  const pf=profiles.find(p=>p.name===report.profile);
  if(pf?.resume)return pf.resume.replace(/^.*[\\/]/,'');
  return report.profile;
}

async function doUpload(files){
  const s=$('#uploadStatus');if(!s||!files.length)return;
  for(const f of files){
    const baseName=f.name.replace(/\.[^.]+$/,'');
    showModal('&#x1f4c4; 填写求职意向 — '+esc(f.name),
      `<div class="text-sm" style="margin-bottom:8px">为简历设置搜索关键词，Agent 巡检时会用这些词搜索岗位。</div>

      <label>岗位类型</label><div style="display:flex;gap:16px;padding:8px 0">${['社招','校招','实习'].map(t=>`<label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px"><input type="checkbox" class="cfmJobType" value="${t}" ${t==='社招'?'checked':''}> ${t}</label>`).join('')}</div>
      <label>搜索关键词 <span class="text-muted text-sm">(逗号或空格分隔)</span></label><input id="cfmKw" placeholder="例: 产品经理, TOB, SaaS, AI产品">
      <div class="text-sm text-muted mt-2">文件: ${esc(f.name)} · ${fs(f.size)}</div>
      <div class="mt-3 flex gap-2"><button class="btn btn-primary" id="cfmBtn">确认并创建意向</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button></div>`,
      '480px'
    );
    setTimeout(()=>{
      const btn=$('#cfmBtn');if(!btn)return;
      btn.addEventListener('click',async()=>{
        btn.disabled=true;btn.innerHTML='<span class="spinner"></span> 保存中...';
        const kwRaw=$('#cfmKw')?.value||'';
        const kwList=kwRaw.split(/[,，\s]+/).map(x=>x.trim()).filter(Boolean);
        const jobTypes=[...document.querySelectorAll('.cfmJobType:checked')].map(cb=>cb.value);
        try{
          const fd=new FormData();fd.append('file',f);
          const up=await fetch('/api/resumes',{method:'POST',body:fd}).then(r=>r.json());
          if(!up.ok){s.innerHTML='&#x274c; 上传失败';btn.disabled=false;return}
          const cfm=await api('/api/resumes/confirm',{method:'POST',body:JSON.stringify({
            filename:up.filename, keywords:kwList,
            job_types:jobTypes.length?jobTypes:['社招'],
            profile_name:$('#cfmName')?.value||baseName
          })});
          document.querySelector('.modal-overlay')?.remove();
          s.innerHTML='&#x2705; '+esc(cfm.filename)+' — 意向「'+esc(cfm.profile_name)+'」已创建';
          setTimeout(()=>renderers.tasks(),600);
        }catch(e){s.innerHTML='&#x274c; '+esc(e.message);btn.disabled=false;btn.textContent='确认并创建意向'}
      });
    },100);
  }
}

window.deleteResumeAndRefresh=async(name)=>{
  if(!confirm('删除简历 "'+name+'"？'))return;
  await api('/api/resumes/'+encodeURIComponent(name),{method:'DELETE'});
  if(_tasksSelectedResume===name)_tasksSelectedResume=null;
  renderers.tasks();
};

window.previewResumeInline=(rn)=>window.previewResume(rn);
window.viewProfileResume=async(n)=>{try{const r=await api('/api/profiles/'+encodeURIComponent(n)+'/resume');showModal('&#x1f4c4; '+n+' — '+esc(r.filename),r.format==='md'?`<div class="markdown-body">${marked.parse(r.content)}</div>`:`<pre style="white-space:pre-wrap;font-size:13px;max-height:60vh;overflow-y:auto">${esc(r.content)}</pre>`,'700px')}catch(e){toast('无法加载: '+e.message)}};
window.viewProfileResumeByName=async(rn)=>{try{const r=await fetch('/resumes/'+encodeURIComponent(rn)).then(r=>r.text());const ext=rn.split('.').pop()?.toLowerCase();showModal('&#x1f4c4; '+esc(rn),ext==='md'?`<div class="markdown-body">${marked.parse(r)}</div>`:`<pre style="white-space:pre-wrap;font-size:13px;max-height:60vh;overflow-y:auto">${esc(r)}</pre>`,'700px')}catch(e){toast('预览失败: '+e.message)}};

window.toggleFs=async(en)=>{await api('/api/config',{method:'PUT',body:JSON.stringify({feishu:{enabled:en}})});toast(en?'飞书推送已开启':'飞书推送已关闭')};
window.togglePf=async(n,en)=>{await api('/api/config',{method:'PUT',body:JSON.stringify({profiles:[{name:n,enabled:en}]})});toast(`${n} ${en?'已启用':'已禁用'}`)};
window.copyAgentCmd=async()=>{
  const cfg=await api('/api/config');
  const profiles=cfg.profiles||[];
  const rn=_tasksSelectedResume;
  if(!rn)return toast('请先在左侧选择一份简历');
  const pf=profiles.find(p=>p.resume&&p.resume.includes(rn));
  if(!pf)return toast('该简历尚未关联意向，请先上传并确认');
  const types=pf.job_types||[pf.job_type||'社招'];
  const typeMap={'社招':'social','校招':'campus','实习':'internship'};
  for(const t of types){
    try{
      const r=await api('/api/run',{method:'POST',body:JSON.stringify({profile:pf.name,job_type:typeMap[t]||'social'})});
      toast(r.message);
    }catch(e){toast('启动失败: '+e.message)}
  }
};

window.viewReport=async(rp)=>{const md=await api('/api/reports/'+encodeURIComponent(rp));const reports=await api('/api/reports');const meta=reports.find(r=>r.relpath===rp);const dur=meta?.duration_str?`<span class="text-sm text-muted" style="margin-left:12px">&#x23f1; ${esc(meta.duration_str)}</span>`:'';$('#reportDetail').innerHTML=`<div class="card"><div class="card-header"><h3>&#x1f4c4; ${esc(rp)}${dur}</h3><button class="btn btn-outline btn-sm" onclick="this.closest('#reportDetail').innerHTML=''">关闭</button></div><div class="markdown-body">${marked.parse(md)}</div></div>`;$('#reportDetail').scrollIntoView({behavior:'smooth'})};

loadTab('tasks');
