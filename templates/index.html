<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartJobHunter Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --primary: #1E40AF;
  --primary-light: #3B82F6;
  --primary-bg: #EFF6FF;
  --accent: #D97706;
  --text: #1E293B;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --border: #DBEAFE;
  --border-light: #E2E8F0;
  --muted: #E9EEF6;
  --green: #16A34A;
  --green-bg: #F0FDF4;
  --red: #DC2626;
  --red-bg: #FEF2F2;
  --yellow: #CA8A04;
  --yellow-bg: #FEFCE8;
  --font-mono: 'Fira Code', 'Consolas', monospace;
  --font-sans: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --transition: 150ms ease;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}
header h1 {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 600;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
header h1 span { color: var(--accent); }

/* ── Navigation Tabs ── */
nav { display: flex; gap: 2px; overflow-x: auto; }
nav button {
  background: transparent;
  color: var(--text-secondary);
  border: none;
  padding: 8px 16px;
  cursor: pointer;
  border-radius: 6px;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: background var(--transition), color var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
nav button:hover { background: var(--muted); color: var(--text); }
nav button.active { background: var(--primary-bg); color: var(--primary); font-weight: 600; }

/* ── Main Content ── */
main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px;
}

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition);
}
.card:hover { box-shadow: var(--shadow); }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.card-header h3 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
}

/* ── Status Badges ── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
}
.badge-ok { background: var(--green-bg); color: var(--green); }
.badge-warn { background: var(--yellow-bg); color: var(--yellow); }
.badge-err { background: var(--red-bg); color: var(--red); }
.badge-info { background: var(--primary-bg); color: var(--primary); }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 6px;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #1E3A8A; }
.btn-outline { background: transparent; border-color: var(--border); color: var(--text-secondary); }
.btn-outline:hover { background: var(--muted); color: var(--text); }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red-bg); }
.btn-sm { padding: 4px 12px; font-size: 12px; }

/* ── Toggle Switch ── */
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
.toggle input { display: none; }
.toggle-track {
  width: 40px; height: 22px;
  background: var(--text-muted);
  border-radius: 11px;
  position: relative;
  transition: background var(--transition);
}
.toggle input:checked + .toggle-track { background: var(--green); }
.toggle-track::after {
  content: ''; position: absolute;
  width: 18px; height: 18px;
  background: #fff; border-radius: 50%;
  top: 2px; left: 2px;
  transition: transform var(--transition);
}
.toggle input:checked + .toggle-track::after { transform: translateX(18px); }

/* ── Tables ── */
.table-row {
  display: grid;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-light);
  gap: 12px;
  font-size: 13px;
}
.table-row:last-child { border-bottom: none; }
.table-row:hover { background: var(--bg); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }

/* ── Forms ── */
input[type="text"], input[type="url"], textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: var(--font-sans);
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  transition: border-color var(--transition);
}
input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,.12); }

/* ── Upload Zone ── */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
  color: var(--text-muted);
}
.upload-zone:hover { border-color: var(--primary-light); background: var(--primary-bg); }
.upload-zone.drag-over { border-color: var(--primary); background: var(--primary-bg); }

/* ── Grid ── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-value { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* ── Responsive ── */
@media (max-width: 768px) {
  header { padding: 0 12px; }
  header h1 { font-size: 15px; }
  nav button { padding: 6px 10px; font-size: 12px; }
  main { padding: 12px; }
}

/* ── Utilities ── */
.text-muted { color: var(--text-muted); }
.text-sm { font-size: 12px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mr-2 { margin-right: 8px; }
.flex { display: flex; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-2 { gap: 8px; }
.flex-wrap { flex-wrap: wrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
code { font-family: var(--font-mono); font-size: 12px; background: var(--muted); padding: 1px 6px; border-radius: 3px; color: var(--primary); }
pre { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; font-size: 13px; line-height: 1.7; max-height: 70vh; overflow-y: auto; white-space: pre-wrap; }

/* ── Loading ── */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Tooltip / Copy feedback ── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--text); color: #fff;
  padding: 10px 20px; border-radius: 8px;
  font-size: 13px; z-index: 9999;
  animation: toastIn .3s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <h1>&#x1f3af; SmartJobHunter <span>Console</span></h1>
  <nav id="tabs">
    <button class="active" data-tab="companies">&#x1f4cb; 公司配置</button>
    <button data-tab="resumes">&#x1f4c4; 简历管理</button>
    <button data-tab="config">&#x2699;&#xfe0f; 任务配置</button>
    <button data-tab="reports">&#x1f4ca; 巡检结果</button>
    <button data-tab="health">&#x1fa79; 健康面板</button>
  </nav>
</header>

<main id="content"></main>

<script>
// ── API helper ──
const $ = (sel, ctx) => (ctx || document).querySelector(sel);
const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    const msg = await res.text().catch(() => '');
    throw new Error(msg || `${res.status} ${res.statusText}`);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg; document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function formatSize(b) { return b < 1048576 ? Math.round(b/1024)+' KB' : (b/1048576).toFixed(1)+' MB'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Tab routing ──
const renderers = {};
function loadTab(name) {
  const fn = renderers[name];
  if (fn) fn();
}

$$('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadTab(btn.dataset.tab);
  });
});

// ══════════════════════════════════════════════
// Tab 1: Companies
// ══════════════════════════════════════════════
renderers.companies = async () => {
  const data = await api('/api/companies');
  const html = `
    <div class="card">
      <div class="card-header"><h3>已配置公司 (${data.length} 家)</h3></div>
      ${data.map(c => `
        <div class="table-row" style="grid-template-columns:1fr auto auto">
          <div>
            <div class="flex gap-2" style="align-items:center">
              <strong>${esc(c.name)}</strong>
              <code>${esc(c.id)}</code>
              <span class="badge ${c.enabled ? 'badge-ok' : 'badge-warn'}">${c.enabled ? '已启用' : '已禁用'}</span>
              ${c.strategy_type !== 'unknown' ? `<span class="badge badge-info">${esc(c.strategy_type)}</span>` : ''}
            </div>
            <div class="text-muted text-sm mt-2">
              ${Object.entries(c.urls||{}).map(([k,v]) => `<span class="mr-2">${k}: ${esc(v.substring(0,60))}${v.length>60?'...':''}</span>`).join('')}
            </div>
            ${c.note ? `<div class="text-muted text-sm mt-2">📝 ${esc(c.note)}</div>` : ''}
          </div>
          <label class="toggle">
            <input type="checkbox" ${c.enabled?'checked':''} onchange="toggleCompany('${esc(c.id)}',this.checked)">
            <div class="toggle-track"></div>
          </label>
          <button class="btn btn-outline btn-sm" onclick="testCompany('${esc(c.id)}')">&#x1f9ea; 测试</button>
        </div>
        <div id="test-${esc(c.id)}" class="text-sm mt-2" style="padding-left:8px"></div>
      `).join('')}
    </div>`;
  document.getElementById('content').innerHTML = html;
};

window.toggleCompany = async (id, enabled) => {
  await api(`/api/companies/${id}`, { method: 'PUT', body: JSON.stringify({ enabled }) });
  toast(`${enabled ? '✅ 已启用' : '⏸ 已禁用'} ${id}`);
};

window.testCompany = async (id) => {
  const el = document.getElementById(`test-${id}`);
  el.innerHTML = '<span class="spinner"></span> 测试抓取中...';
  try {
    const r = await api(`/api/companies/${id}/test`, { method: 'POST', body: JSON.stringify({ keyword: '产品经理', job_type: 'social' }) });
    el.innerHTML = r.ok
      ? `<span style="color:var(--green)">✅ ${r.jobs_count} 个岗位:</span> ${(r.sample_titles||[]).join(' · ')}`
      : `<span style="color:var(--red)">❌ 抓取失败:</span> ${esc(r.error||'无数据')}`;
  } catch (e) {
    el.innerHTML = `<span style="color:var(--red)">❌ ${esc(e.message)}</span>`;
  }
};

// ══════════════════════════════════════════════
// Tab 2: Resumes
// ══════════════════════════════════════════════
renderers.resumes = async () => {
  const data = await api('/api/resumes');
  const html = `
    <div class="card">
      <div class="card-header"><h3>上传简历</h3></div>
      <div class="upload-zone" id="dropZone">
        <div style="font-size:32px;margin-bottom:8px">&#x1f4c4;</div>
        <div>拖拽文件到此处，或点击选择</div>
        <div class="text-sm text-muted mt-2">支持 .txt .md .docx .pdf .png .jpg，最大 10 MB</div>
        <input type="file" id="resumeInput" accept=".txt,.md,.docx,.pdf,.png,.jpg,.jpeg" multiple style="display:none">
      </div>
      <div id="uploadStatus" class="mt-2 text-sm"></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>已上传 (${data.length} 个文件)</h3></div>
      ${data.length === 0 ? '<div class="text-muted text-sm">暂无简历文件</div>' : data.map(f => `
        <div class="table-row" style="grid-template-columns:1fr auto auto">
          <div>
            <span>&#x1f4c4; ${esc(f.name)}</span>
            <span class="text-muted text-sm" style="margin-left:12px">${formatSize(f.size)} · ${(f.modified||'').slice(0,10)}</span>
          </div>
          <span class="badge badge-info">${esc(f.format)}</span>
          <button class="btn btn-danger btn-sm" onclick="deleteResume('${esc(f.name)}')">删除</button>
        </div>
      `).join('')}
    </div>`;
  document.getElementById('content').innerHTML = html;

  // Upload handlers
  const zone = document.getElementById('dropZone');
  const input = document.getElementById('resumeInput');
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); uploadFiles(e.dataTransfer.files); });
  input.addEventListener('change', () => uploadFiles(input.files));
};

async function uploadFiles(files) {
  const status = document.getElementById('uploadStatus');
  for (const f of files) {
    status.innerHTML = `<span class="spinner"></span> 上传中: ${esc(f.name)}...`;
    const form = new FormData(); form.append('file', f);
    try {
      const r = await fetch('/api/resumes', { method: 'POST', body: form }).then(r => r.json());
      status.innerHTML = r.ok ? `✅ ${esc(f.name)} 上传成功` : `❌ ${esc(f.name)} 失败`;
      if (r.referenced_by?.length) status.innerHTML += ` (关联意向: ${r.referenced_by.join(', ')})`;
    } catch (e) {
      status.innerHTML = `❌ ${esc(e.message)}`;
    }
  }
  setTimeout(() => renderers.resumes(), 800);
}

window.deleteResume = async (name) => {
  if (!confirm(`确定删除 "${name}"？`)) return;
  const r = await api(`/api/resumes/${encodeURIComponent(name)}`, { method: 'DELETE' });
  if (r.warnings?.length) toast('⚠️ ' + r.warnings.join('; '));
  renderers.resumes();
};

// ══════════════════════════════════════════════
// Tab 3: Config
// ══════════════════════════════════════════════
renderers.config = async () => {
  const data = await api('/api/config');
  const html = `
    <div class="card">
      <div class="card-header"><h3>&#x1f916; 基础配置</h3></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px">
        <div><div class="text-muted text-sm">决策级别</div><strong>${esc(data.decision_level)}</strong></div>
        <div><div class="text-muted text-sm">评分阈值</div><strong>${data.threshold_score}</strong></div>
        <div><div class="text-muted text-sm">时间过滤</div><strong>${data.time_filter_days} 天</strong></div>
        <div><div class="text-muted text-sm">报告最多岗位</div><strong>${data.output?.max_jobs_per_report || '-'}</strong></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h3>&#x1f4e1; 飞书推送</h3></div>
      <div class="flex" style="align-items:center;gap:24px">
        <label class="toggle">
          <input type="checkbox" ${data.feishu?.enabled?'checked':''} onchange="toggleFeishu(this.checked)">
          <div class="toggle-track"></div>
          <span>${data.feishu?.enabled ? '已开启' : '已关闭'}</span>
        </label>
        <span class="text-sm text-muted">凭证: ${data.feishu?.has_credentials ? '已配置' : '未配置'} · Wiki: ${data.feishu?.has_wiki ? '已配置' : '未配置'} · Bitable: ${data.feishu?.has_bitable ? '已配置' : '未配置'}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h3>&#x1f4cb; 求职意向</h3><span class="text-sm text-muted">${data.profiles.filter(p=>p.enabled).length} / ${data.profiles.length} 启用</span></div>
      ${data.profiles.map(p => `
        <div class="table-row" style="grid-template-columns:1fr auto">
          <div>
            <span>&#x1f4cc; <strong>${esc(p.name)}</strong></span>
            <code style="margin-left:8px">${esc(p.job_type||'')}</code>
            ${p.keywords?.length ? `<span class="text-muted text-sm" style="margin-left:8px">关键词: ${p.keywords.join(', ')}</span>` : ''}
            ${p.resume ? `<span class="text-muted text-sm" style="margin-left:8px">📄 ${esc(p.resume)}</span>` : ''}
          </div>
          <label class="toggle">
            <input type="checkbox" ${p.enabled?'checked':''} onchange="toggleProfile('${esc(p.name)}',this.checked)">
            <div class="toggle-track"></div>
          </label>
        </div>
      `).join('')}
    </div>`;
  document.getElementById('content').innerHTML = html;
};

window.toggleFeishu = async (enabled) => {
  await api('/api/config', { method: 'PUT', body: JSON.stringify({ feishu: { enabled } }) });
  toast(enabled ? '✅ 飞书推送已开启' : '⏸ 飞书推送已关闭');
};

window.toggleProfile = async (name, enabled) => {
  await api('/api/config', { method: 'PUT', body: JSON.stringify({ profiles: [{ name, enabled }] }) });
  toast(`${enabled ? '✅' : '⏸'} ${name} ${enabled ? '已启用' : '已禁用'}`);
};

// ══════════════════════════════════════════════
// Tab 4: Reports
// ══════════════════════════════════════════════
let _reportData = [];
renderers.reports = async () => {
  _reportData = await api('/api/reports');
  const profiles = [...new Set(_reportData.map(r => r.profile).filter(Boolean))];
  const html = `
    ${profiles.length ? `
    <div class="card flex gap-2 flex-wrap" style="padding:12px 20px">
      <button class="btn btn-sm btn-primary filter-btn" data-filter="all">全部</button>
      ${profiles.map(p => `<button class="btn btn-sm btn-outline filter-btn" data-filter="${esc(p)}">${esc(p)}</button>`).join('')}
    </div>` : ''}
    ${_reportData.length === 0
      ? '<div class="card"><div class="text-muted">暂无巡检报告。运行 <code>python -m src.cli</code> 生成第一份报告。</div></div>'
      : _reportData.map(r => `
        <div class="card report-item" data-profile="${esc(r.profile||'')}" style="cursor:pointer" onclick="viewReport('${esc(r.relpath)}')">
          <div class="flex-between">
            <div>
              <strong>&#x1f4c5; ${esc(r.generated||r.modified?.slice(0,10)||'')}</strong>
              <span style="margin-left:12px;color:var(--text-secondary)">${esc(r.profile||'未知意向')} · ${r.job_count} 岗位 · 最高 <strong>${r.top_score}</strong> 分</span>
            </div>
            <span class="text-muted text-sm">${formatSize(r.size)}</span>
          </div>
        </div>
      `).join('')}
    <div id="reportDetail"></div>`;
  document.getElementById('content').innerHTML = html;

  // Filter buttons
  $$('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.filter-btn').forEach(b => { b.classList.remove('btn-primary'); b.classList.add('btn-outline'); });
      btn.classList.remove('btn-outline'); btn.classList.add('btn-primary');
      const f = btn.dataset.filter;
      $$('.report-item').forEach(el => { el.style.display = (f === 'all' || el.dataset.profile === f) ? '' : 'none'; });
    });
  });
};

window.viewReport = async (relpath) => {
  const md = await api('/api/reports/' + encodeURIComponent(relpath));
  const el = document.getElementById('reportDetail');
  el.innerHTML = `<div class="card"><div class="card-header"><h3>&#x1f4c4; ${esc(relpath)}</h3><button class="btn btn-outline btn-sm" onclick="document.getElementById('reportDetail').innerHTML=''">关闭</button></div><pre>${esc(md)}</pre></div>`;
  el.scrollIntoView({ behavior: 'smooth' });
};

// ══════════════════════════════════════════════
// Tab 5: Health
// ══════════════════════════════════════════════
renderers.health = async () => {
  const data = await api('/api/health');
  const s = data.summary;
  const statusClass = st => st === 'blocked' ? 'badge-err' : st === 'pending' ? 'badge-warn' : st === 'repaired' ? 'badge-ok' : 'badge-info';
  const statusLabel = st => ({pending:'待处理',blocked:'阻塞',failed:'失败',repaired:'已修复'}[st] || st);
  const html = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value">${s.total}</div><div class="stat-label">总异常</div></div>
      <div class="stat-card" style="border-left:3px solid var(--yellow)"><div class="stat-value">${s.pending}</div><div class="stat-label">待处理</div></div>
      <div class="stat-card" style="border-left:3px solid var(--red)"><div class="stat-value">${s.blocked}</div><div class="stat-label">阻塞</div></div>
      <div class="stat-card" style="border-left:3px solid var(--text-muted)"><div class="stat-value">${s.failed}</div><div class="stat-label">失败</div></div>
    </div>
    ${s.total === 0
      ? '<div class="card"><div class="text-muted">&#x2705; 暂无策略异常 — 所有已启用公司抓取策略正常。</div></div>'
      : data.tasks.map(t => `
        <div class="card">
          <div class="flex-between">
            <div class="flex gap-2" style="align-items:center">
              <strong>${esc(t.company_name)}</strong>
              <span class="badge ${statusClass(t.status)}">${statusLabel(t.status)}</span>
            </div>
            <span class="text-muted text-sm">${(t.created_at||'').slice(0,16)}</span>
          </div>
          ${t.reason ? `<div class="text-sm mt-2" style="color:var(--text-secondary)">原因: ${esc(t.reason)}</div>` : ''}
          ${t.evidence_dir ? `<div class="text-sm text-muted mt-2">&#x1f4c1; ${esc(t.evidence_dir)}</div>` : ''}
        </div>
      `).join('')}
  `;
  document.getElementById('content').innerHTML = html;
};

// ── Init ──
loadTab('companies');
