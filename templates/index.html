@media(min-width:1280px){.task-layout{grid-template-columns:320px minmax(0,1fr)}.report-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

<body>
<header class="app-header">
  <div class="brand"><span class="brand-mark">S</span>SmartHunter</div>
  <nav class="app-nav" aria-label="主导航">
    <button class="nav-item active" data-tab="tasks" aria-current="page">简历与岗位</button>
    <button class="nav-item" data-tab="health">策略健康 <span class="nav-count alert" id="healthBadge">0</span></button>
    <button class="nav-item" data-tab="strategy">公司配置 <span class="nav-count" id="coCount">0</span></button>
    <button class="nav-item" data-tab="feishu">飞书推送</button>
    <button class="nav-item" data-tab="schedule">定时任务</button>
  </nav>
</header>
<header class="page-heading" id="topbar" hidden>
  <h1 id="pageTitle">简历与岗位</h1>
  <div class="topbar-right" id="topbarActions"></div>
</header>
<main id="content"></main>
<script>

// ── Helpers ──
const $=(s,c)=>(c||document).querySelector(s);
const $$=(s,c)=>[...(c||document).querySelectorAll(s)];
async function api(path,opts={}){
  const res=await fetch(path,{headers:opts.body instanceof FormData?{}:{'Content-Type':'application/json'},...opts});
  if(!res.ok){const m=await res.text().catch(()=>'');throw new Error(m||`${res.status}`)}
  const ct=res.headers.get('content-type')||'';
  return ct.includes('application/json')?res.json():res.text();
}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function fs(b){return b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function arg(value){return esc(JSON.stringify(String(value)))}
function closeTopModal(){const modal=$$('.modal-overlay[open]').at(-1);if(modal)modal.close()}
let _modalIndex=0,_previousBodyOverflow='';
function showModal(title,bodyHtml,w='520px'){
  const ov=document.createElement('dialog');ov.className='modal-overlay';
  const titleId=`modalTitle${++_modalIndex}`;
  ov.setAttribute('aria-labelledby',titleId);
  ov.innerHTML=`<div class="modal-box" style="width:${w}"><header class="modal-header"><h3 id="${titleId}">${title}</h3><button class="btn btn-quiet" onclick="this.closest('.modal-overlay').close()">关闭 ×</button></header><div class="modal-body">${bodyHtml}</div></div>`;
  if(!document.querySelector('.modal-overlay')){_previousBodyOverflow=document.body.style.overflow;document.body.style.overflow='hidden'}
  document.body.appendChild(ov);
  ov.addEventListener('close',()=>{ov.remove();if(!document.querySelector('.modal-overlay'))document.body.style.overflow=_previousBodyOverflow});
  ov.addEventListener('click',event=>{if(event.target===ov)ov.close()});
  ov.showModal();
  return ov;
}

function renderMarkdown(markdown){
  const article=document.createElement('article');article.className='markdown-body';
  article.innerHTML=marked.parse(markdown,{gfm:true,breaks:false});
  article.querySelectorAll('table').forEach(table=>{const wrapper=document.createElement('div');wrapper.className='md-table';table.before(wrapper);wrapper.appendChild(table)});
  article.querySelectorAll('a').forEach(link=>{link.target='_blank';link.rel='noopener noreferrer'});
  return article;
}

window.viewReport=async(path)=>{
  const version=++_reportVersion,selectedResume=_tasksSelectedResume;
  const dialog=showModal(esc(path.split('/').pop()),'<div class="loading-state" role="status">加载报告…</div>','980px');
  dialog.classList.add('report-modal');
  try{
    const markdown=await api('/api/reports/'+encodeURIComponent(path));
    if(!dialog.isConnected||!dialog.open||version!==_reportVersion||selectedResume!==_tasksSelectedResume||_currentTab!=='tasks'){if(dialog.isConnected)dialog.close();return}
    dialog.querySelector('.modal-body').replaceChildren(renderMarkdown(markdown));
  }catch(error){if(dialog.isConnected&&dialog.open)dialog.querySelector('.modal-body').innerHTML=`<div class="empty-state" role="alert">报告加载失败：${esc(error.message)}</div>`}
};

const LABEL={social:'社招',campus:'校招',internship:'实习'};
const TITLES={tasks:'简历与岗位',health:'策略健康',strategy:'公司配置',feishu:'飞书推送',schedule:'定时任务'};

let _coData=[],_healthData=null,_resumeData=[],_coFilter='all',_coHealthFilter='all',_selCompanies=new Set(),_tasksSelectedResume=null,_currentTab='tasks';
const renderers={};
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── Tab switching ──
function switchTab(tab){
  _currentTab=tab;++_reportVersion;
  $$('.modal-overlay[open]').forEach(dialog=>dialog.close());
  $$('.nav-item[data-tab]').forEach(button=>{const selected=button.dataset.tab===tab;button.classList.toggle('active',selected);if(selected)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});

async function runInspect(){

  if(!resume)return toast('请先选择一份简历');

let _taskData=null,_taskVersion=0,_reportVersion=0,_reportRange='all',_runStarting=false;

renderers.tasks=async()=>{
  const version=++_taskVersion;
  $('#topbarActions').innerHTML='';
  if(!_taskData)$('#content').innerHTML='<div class="loading-state" role="status">加载中…</div>';
  try{
    const[cfg,reports,resumePayload]=await Promise.all([api('/api/config'),api('/api/reports'),api('/api/resumes')]);
    if(version!==_taskVersion||_currentTab!=='tasks')return;
    _resumeData=resumePayload.resumes||[];
    _taskData={cfg,reports,unsupported:resumePayload.unsupported_files||[]};
    if(!_resumeData.some(r=>r.resume_id===_tasksSelectedResume))_tasksSelectedResume=_resumeData[0]?.resume_id||null;
    renderTaskWorkspace();
  }catch(e){if(version===_taskVersion&&_currentTab==='tasks')$('#content').innerHTML=`<div class="empty-state" role="alert">加载失败：${esc(e.message)} <button class="btn btn-outline btn-sm" onclick="renderers.tasks()">重试</button></div>`}
};

function _findResumeForReport(report,profiles){
  if(!report.profile)return'';
  const profile=profiles.find(p=>p.name===report.profile);
  return profile?.resume?profile.resume.replace(/^.*[\\/]/,''):report.profile;
}

function reportsForResume(resume){
  return (_taskData?.reports||[]).filter(report=>_findResumeForReport(report,_taskData.cfg.profiles||[])===resume.filename)
    .sort((a,b)=>(b.generated||b.modified||'').localeCompare(a.generated||a.modified||''));
}

function renderTaskWorkspace(){
  if(!_taskData||_currentTab!=='tasks')return;
  const resume=_resumeData.find(r=>r.resume_id===_tasksSelectedResume);
  const left=`<aside class="resume-sidebar"><h2>简历</h2><div class="resume-list">${_resumeData.map(r=>`<button type="button" class="resume-option" data-resume-id="${esc(r.resume_id)}" aria-pressed="${r.resume_id===_tasksSelectedResume}"><span class="resume-option-name">${esc(r.display_name||r.filename)}</span><span class="resume-option-meta">${esc((r.job_types||[]).join(' / ')||'待设置意向')} · ${reportsForResume(r).length} 份报告${r.enabled===false?' · 已暂停':''}</span></button>`).join('')}</div><div class="resume-tools"><button class="btn btn-quiet" onclick="showResumeManager()">管理简历</button><button class="btn btn-quiet" onclick="showUploadModal()">+ 添加简历</button></div>${_taskData.unsupported.length?`<div class="text-sm mt-3" style="color:var(--red)">不支持的文件已忽略：${_taskData.unsupported.map(esc).join('、')}</div>`:''}</aside>`;
  let right='';
  if(!resume){right='<div class="empty-state">暂无简历 <button class="btn btn-primary mt-3" onclick="showUploadModal()">添加简历</button></div>'}
  else{
    const profile=(_taskData.cfg.profiles||[]).find(p=>p.resume?.replace(/^.*[\\/]/,'')===resume.filename);
    const status=!resume.keywords?.length?'<span class="badge badge-warn">待补充关键词</span>':!resume.job_types?.length?'<span class="badge badge-warn">待选择岗位类型</span>':profile?'<span class="badge badge-ok">已建档</span>':'<span class="badge badge-info">待 Agent 建档</span>';
    const disabled=_runStarting||!resume.keywords?.length||!resume.job_types?.length;
    right=`<header class="object-header"><div class="object-heading"><div class="object-label">当前简历</div><h1>${esc(resume.display_name||resume.filename)}</h1><div class="object-meta"><span>${esc((resume.format||'').toUpperCase())} · ${fs(resume.size||0)}</span>${status}</div></div><button class="btn btn-primary" id="findJobsBtn" onclick="runInspect()" ${disabled?'disabled':''}>${_runStarting?'<span class="spinner"></span> 正在启动…':'查找岗位'}</button></header>`;
    right+=`<section class="intent-section" aria-label="当前简历的搜索意向"><div class="section-heading"><h2>搜索意向</h2><button class="btn btn-quiet" onclick="showIntentModal(${arg(resume.resume_id)})">修改意向</button></div><div class="intent-tags">${[...(resume.job_types||[]),...(resume.keywords||[])].map(word=>`<span class="kw-tag">${esc(word)}</span>`).join('')}</div></section>`;
    right+=`<section aria-label="当前简历的岗位报告"><div class="section-heading"><h2>岗位报告</h2><select class="compact-select" id="reportRange" aria-label="报告时间范围" onchange="_reportRange=this.value;renderTaskWorkspace()"><option value="all" ${_reportRange==='all'?'selected':''}>全部时间</option><option value="today" ${_reportRange==='today'?'selected':''}>今天</option></select></div>`;
    const now=new Date();const today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
    const reports=reportsForResume(resume).filter(report=>_reportRange!=='today'||(report.generated||report.modified||'').startsWith(today));
    right+=reports.length?`<div class="report-grid">${reports.map((report,index)=>{
      const generated=report.generated||report.modified||'';
      return `<button type="button" class="report-card" data-report="${esc(report.relpath)}"><span class="report-card-top">${index===0?'最新报告':'历史报告'}</span><h3>${esc(generated.slice(0,10)||report.filename||'岗位报告')}</h3><span class="report-card-meta">${esc(generated.slice(11,16))}${report.job_type?' · '+esc(LABEL[report.job_type]||report.job_type):''}${report.duration_str?' · '+esc(report.duration_str):''}</span><span class="report-metrics"><span><span class="metric-value metric-count">${report.job_count||0}</span><span class="metric-label">推荐岗位</span></span><span><span class="metric-value metric-score">${report.top_score||0}<span class="metric-unit"> 分</span></span><span class="metric-label">最高匹配</span></span><span class="report-open">打开报告 ↗</span></span></button>`;
    }).join('')}</div>`:'<div class="empty-state">暂无岗位报告</div>';
    right+='</section>';
  }
  $('#content').innerHTML=`<div class="task-layout">${left}<div class="task-canvas">${right}</div></div>`;
}

window.showUploadModal=()=>{
  const dialog=showModal('添加简历','<div class="upload-zone" id="dropZone" role="button" tabindex="0">+ 上传简历<div class="text-sm text-muted">拖拽或点击 · .pdf .md .txt</div><input type="file" id="resumeInput" accept=".pdf,.md,.txt" multiple hidden></div><div id="uploadStatus" class="text-sm mt-2" role="status"></div>');
  const zone=dialog.querySelector('#dropZone'),input=dialog.querySelector('#resumeInput');
  zone.addEventListener('click',event=>{if(event.target!==input)input.click()});
  zone.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();input.click()}});
  zone.addEventListener('dragover',event=>{event.preventDefault();zone.classList.add('drag-over')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
  zone.addEventListener('drop',event=>{event.preventDefault();zone.classList.remove('drag-over');doUpload(event.dataTransfer.files)});
  input.addEventListener('change',()=>doUpload(input.files));
};

async function doUpload(files){
  const s=$('#uploadStatus');if(!s||!files.length)return;
  for(const f of files){
    const bn=f.name.replace(/\.[^.]+$/,'');
    // Upload file immediately so confirm is instant
    s.innerHTML='<span class="spinner"></span> 上传中...';
    let analyzed=null;
    try{
      const fd=new FormData();fd.append('file',f);
      analyzed=await fetch('/api/resumes/analyze',{method:'POST',body:fd}).then(r=>r.json());
      s.innerHTML='';
    }catch(e){s.innerHTML='上传失败: '+e.message;return}

    if(!analyzed.ok){s.innerHTML=analyzed.detail||'上传失败';return}

    showModal('填写求职意向 — '+esc(f.name),
      `<div class="text-sm" style="margin-bottom:8px"><span style="color:var(--green)">✓ 文件已上传 (${fs(f.size)})</span></div>
      <label>意向名称</label><input id="cfmName" value="${esc(bn)}">
      <label>岗位类型</label><div style="display:flex;gap:8px;padding:6px 0">${['社招','校招','实习'].map((t,i)=>`<button type="button" class="cfmJobType btn ${i===0?'btn-primary':'btn-outline'} btn-sm" data-val="${t}" onclick="this.classList.toggle('btn-primary');this.classList.toggle('btn-outline')">${t}</button>`).join('')}</div>
      <label>搜索关键词 <span class="text-muted text-sm">(逗号或空格分隔)</span></label><input id="cfmKw" placeholder="例: 产品经理, TOB, SaaS">
      <div class="text-sm text-muted mt-2">${esc(f.name)} · ${fs(f.size)}</div>
      <div class="mt-3 flex gap-2"><button class="btn btn-primary" id="cfmBtn">确认</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').close()">取消</button></div>`,`480px`);
    setTimeout(()=>{
      const btn=$('#cfmBtn');if(!btn)return;
      btn.addEventListener('click',async()=>{
        btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
        const kw=$('#cfmKw')?.value||'';const kwl=kw.split(/[,，\s]+/).filter(Boolean);
        const jts=[...document.querySelectorAll('.cfmJobType.btn-primary')].map(b=>b.dataset.val);
        try{
          const saved=await api('/api/resumes/confirm',{method:'POST',body:JSON.stringify({filename:analyzed.filename,keywords:kwl,job_types:jts.length?jts:['社招'],display_name:$('#cfmName')?.value||bn})});
          _tasksSelectedResume=saved.resume_id;closeTopModal();s.innerHTML=analyzed.filename+' 搜索意向已保存';$$('.modal-overlay[open]').forEach(dialog=>dialog.close());
          setTimeout(()=>renderers.tasks(),600);
        }catch(e){btn.disabled=false;btn.textContent='确认';s.innerHTML='失败: '+e.message}
      });
    },100);
  }
}

function renderCompanyGridHtml(companies){
  if(!companies.length)return'<div class="empty-state">没有符合条件的公司</div>';
  const healthMap=Object.fromEntries((_healthData?.tasks||[]).map(task=>[task.company_id,task]));
  return `<div class="table-wrap"><table class="company-table"><thead><tr><th>公司</th><th>启用</th><th>策略健康</th><th class="col-detail">招聘渠道</th><th>操作</th></tr></thead><tbody>${companies.map(co=>{
    const task=healthMap[co.id],status=task?.status;
    const label=task?({pending:'待修复',blocked:'阻塞',failed:'失败',repaired:'已修复'}[status]||status):'正常';
    const cls=!task||status==='repaired'?'badge-ok':status==='blocked'||status==='failed'?'badge-err':'badge-warn';
    return `<tr class="company-row ${co.enabled?'':'company-disabled'}" data-cid="${esc(co.id)}"><td><div class="company-name">${esc(co.name)}</div><div class="company-id">${esc(co.id)}</div>${co.note?`<div class="company-note">${esc(co.note)}</div>`:''}</td><td><label class="toggle" aria-label="启用 ${esc(co.name)}"><input type="checkbox" ${co.enabled?'checked':''} onchange="toggleCo(${arg(co.id)},this.checked)"><span class="toggle-track"></span></label></td><td><span class="badge ${cls}">${esc(label)}</span></td><td class="col-detail"><div class="ccurls">${Object.entries(co.urls||{}).filter(([,url])=>/^https?:\/\//i.test(url)).map(([key,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(LABEL[key]||key)}</a>`).join('')}</div></td><td><div class="company-actions"><button class="btn btn-outline btn-sm" onclick="showEditCoModal(${arg(co.id)})">编辑</button><button class="btn btn-outline btn-sm" onclick="testCo(${arg(co.id)})">测试</button><button class="btn btn-danger btn-sm" onclick="deleteCo(${arg(co.id)})">删除</button></div><span id="test-${esc(co.id)}" class="text-sm">${_coTestResults.get(co.id)||''}</span></td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function renderCompanyRows(){
  if(_currentTab!=='strategy'||!$('#companyResults'))return;
  const query=_coSearch.trim().toLowerCase();
  const companies=_sortCompanies(_coData,_coFilter).filter(co=>!query||(co.name+' '+co.id).toLowerCase().includes(query));
  $('#companyResults').innerHTML=renderCompanyGridHtml(companies);
}

function _sortCompanies(list,sf){
  let out=[...list];out.sort((a,b)=>(b.enabled-a.enabled)||a.name.localeCompare(b.name,'zh'));
  if(sf==='enabled')out=out.filter(c=>c.enabled);else if(sf==='disabled')out=out.filter(c=>!c.enabled);
  if(_coHealthFilter==='pending'&&_healthData){const ids=new Set((_healthData.tasks||[]).filter(t=>t.status==='pending').map(t=>t.company_id));out=out.filter(c=>ids.has(c.id))}
  return out;
}

window.testCo=async(id)=>{const el=$(`#test-${id}`);if(!el)return;el.innerHTML='<span class="spinner"></span>';try{const r=await api(`/api/companies/${id}/test`,{method:'POST',body:JSON.stringify({keyword:'',job_type:'social'})});el.innerHTML=r.ok?`<span style="color:var(--green)">${r.jobs_count}岗</span>`:`<span style="color:var(--red)">失败</span>`;if(!r.ok)el.innerHTML+=` <span class="text-sm text-muted">${esc((r.error||'').substring(0,60))}</span>`;if(r.ok)await api(`/api/health/${encodeURIComponent(id)}`,{method:'DELETE'});_coTestResults.set(id,el.innerHTML);await refreshHealth()}catch(e){el.innerHTML=`<span style="color:var(--red)">错误</span>`;_coTestResults.set(id,el.innerHTML);await refreshHealth()}};
window.deleteCo=async(id)=>{if(!confirm(`删除 "${id}"？`))return;await api(`/api/companies/${id}`,{method:'DELETE'});toast('已删除 '+id);renderers.strategy()};
window.showAddCoModal=()=>{showModal('新增公司',`<label>公司 ID</label><input id="mId" placeholder="例: mycompany"><label>公司名称</label><input id="mName" placeholder="例: 我的公司"><label>社招 URL</label><input id="mUrlS"><label>校招 URL</label><input id="mUrlC"><label>实习 URL</label><input id="mUrlI"><label>策略类型</label><select id="mStrat"><option value="">待定</option><option value="config_intercept">config_intercept</option><option value="config_dom">config_dom</option><option value="custom_python">custom_python</option></select><label>备注</label><input id="mNote"><div class="mt-3 flex gap-2"><button class="btn btn-primary" onclick="createCo()">创建</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').close()">取消</button></div>`)};
window.createCo=async()=>{const b={id:$('#mId').value.trim(),name:$('#mName').value.trim(),enabled:false,urls:{social:$('#mUrlS').value.trim(),campus:$('#mUrlC').value.trim(),internship:$('#mUrlI').value.trim()},note:$('#mNote').value.trim(),strategy_type:$('#mStrat').value};if(!b.id||!b.name)return toast('ID和名称必填');await api('/api/companies',{method:'POST',body:JSON.stringify(b)});closeTopModal();toast('已创建');renderers.strategy()};
window.showEditCoModal=(id)=>{const c=_coData.find(x=>x.id===id);if(!c)return;showModal(`编辑: ${esc(c.name)}`,`<label>公司名称</label><input id="eName" value="${esc(c.name)}"><label>社招 URL</label><input id="eUrlS" value="${esc(c.urls?.social||'')}"><label>校招 URL</label><input id="eUrlC" value="${esc(c.urls?.campus||'')}"><label>实习 URL</label><input id="eUrlI" value="${esc(c.urls?.internship||'')}"><label>备注</label><input id="eNote" value="${esc(c.note||'')}"><div class="mt-3 flex gap-2"><button class="btn btn-primary" onclick="saveCo('${esc(id)}')">保存</button><button class="btn btn-outline" onclick="this.closest('.modal-overlay').close()">取消</button></div>`)};
window.saveCo=async(id)=>{await api(`/api/companies/${id}`,{method:'PUT',body:JSON.stringify({name:$('#eName').value.trim(),note:$('#eNote').value.trim(),urls:{social:$('#eUrlS').value.trim(),campus:$('#eUrlC').value.trim(),internship:$('#eUrlI').value.trim()}})});closeTopModal();toast('已保存');renderers.strategy()};

// ── Health ──
function renderHealthPanel(health){
  const s=health.summary||{total:0,pending:0,blocked:0,failed:0};
  const sc=document.getElementById('content');if(!sc||_currentTab!=='health')return;
  $('#topbarActions').innerHTML='';
  if(s.total===0){sc.innerHTML='<div class="card"><div class="empty-state">所有公司抓取策略正常</div></div>';return}
  let h='<div class="stats-grid">';
  h+=`<div class="stat-card left-accent-primary"><div class="num" style="color:var(--red)">${s.total}</div><div class="lbl">总异常</div></div>`;
  h+=`<div class="stat-card left-accent-yellow"><div class="num" style="color:var(--yellow)">${s.pending}</div><div class="lbl">待处理</div></div>`;
  h+=`<div class="stat-card left-accent-red"><div class="num" style="color:var(--red)">${s.blocked}</div><div class="lbl">阻塞</div></div>`;
  h+=`<div class="stat-card left-accent-muted"><div class="num" style="color:var(--text-muted)">${s.failed}</div><div class="lbl">失败</div></div>`;
  h+='</div>';
  h+='<div class="card"><div class="card-header"><h3>策略任务</h3><div class="btn-group"><button class="btn btn-outline btn-sm" onclick="selectAllHealth()">全选</button><button class="btn btn-outline btn-sm" onclick="clearHealthSel()">取消</button><button class="btn btn-primary btn-sm" id="batchBtn" disabled onclick="batchRepair()">策略巡检 (0)</button><button class="btn btn-outline btn-sm" onclick="refreshHealth()">刷新</button></div></div><div class="card-list">';
  for(const t of health.tasks){
    const cls=t.status==='blocked'?'badge-err':t.status==='pending'?'badge-warn':'badge-info';
    const lbl={pending:'待处理',blocked:'阻塞',failed:'失败',repaired:'已修复'}[t.status]||t.status;
    h+=`<div class="row health-task"><input type="checkbox" class="checkbox hc-cb" aria-label="选择 ${esc(t.company_name)}" data-cid="${esc(t.company_id)}" onchange="toggleHc('${esc(t.company_id)}',this.checked)"><div><strong>${esc(t.company_name)}</strong><span class="badge ${cls}">${lbl}</span><div class="text-sm text-muted mt-1">${esc(t.reason_label||t.reason)}</div></div><span class="text-sm text-muted">${(t.created_at||'').slice(0,16)}</span><button class="btn btn-outline btn-sm" onclick="retryOne('${esc(t.company_id)}')">重试</button></div>`;
  }
  h+='</div></div>';sc.innerHTML=h;const ids=new Set(health.tasks.map(task=>task.company_id));_selCompanies=new Set([..._selCompanies].filter(id=>ids.has(id)));$$('.hc-cb').forEach(input=>input.checked=_selCompanies.has(input.dataset.cid));updateBatchBtn();
}
window.refreshHealth=async()=>{const h=await api('/api/health');_healthData=h;if(_currentTab==='health')renderHealthPanel(h);updateCoBadges();updateHealthBadge()};
window.updateCoBadges=()=>{if(_currentTab==='strategy')renderCompanyRows()};

window.selectAllHealth=()=>{const ids=_healthData.tasks.map(t=>t.company_id);_selCompanies=new Set(ids);$$('.hc-cb').forEach(c=>{c.checked=true});updateBatchBtn()};
window.clearHealthSel=()=>{_selCompanies.clear();$$('.hc-cb').forEach(c=>{c.checked=false});updateBatchBtn()};
window.toggleHc=(cid,ch)=>{if(ch)_selCompanies.add(cid);else _selCompanies.delete(cid);updateBatchBtn()};
window.updateBatchBtn=()=>{const b=$('#batchBtn');if(b){b.disabled=_selCompanies.size===0;b.textContent=`策略巡检 (${_selCompanies.size})`}};
window.batchRepair=async()=>{if(_selCompanies.size===0)return;if(!confirm(`对 ${_selCompanies.size} 家公司执行策略巡检？后台运行，完成后刷新。`))return;await api('/api/health/repair',{method:'POST',body:JSON.stringify({company_ids:[..._selCompanies],keyword:'',job_type:'social'})});toast(`已触发 ${_selCompanies.size} 家公司后台巡检`);_selCompanies.clear();updateBatchBtn()};
window.retryOne=async(id)=>{const btns=$$(`button[onclick*="retryOne('${id}')"]`);btns.forEach(b=>{b.disabled=true;b.innerHTML='<span class="spinner"></span>'});try{const r=await api(`/api/companies/${id}/test`,{method:'POST',body:JSON.stringify({keyword:'',job_type:'social'})});if(r.ok){await api(`/api/health/${encodeURIComponent(id)}`,{method:'DELETE'});toast(`${id}: ${r.jobs_count} 岗位 — 已清除`)}else toast(`${id}: 测试失败`);await refreshHealth()}catch(e){toast('重试失败: '+e.message)}btns.forEach(b=>{b.disabled=false;b.textContent='重试'})};

// Tab: 策略健康 (standalone)
renderers.health=async()=>{
  const h=await api('/api/health');if(_currentTab!=='health')return;_healthData=h;updateHealthBadge();
  $('#topbarActions').innerHTML='<button class="btn btn-outline btn-sm" onclick="renderers.health()">刷新</button>';
  document.getElementById('content').innerHTML='';
  renderHealthPanel(h);
};

// Tab: 飞书推送 (standalone)
renderers.feishu=async()=>{
  const cfg=await api('/api/config');if(_currentTab!=='feishu')return;const fconf=cfg.feishu||{};const fmeta=cfg.feishu_meta||{};
  $('#topbarActions').innerHTML='';
  let h='<div class="card" style="max-width:760px"><div class="card-header"><h3>飞书推送配置</h3></div>';
  h+='<label class="toggle" style="margin-bottom:20px;display:flex"><input type="checkbox" '+ (fconf.enabled?"checked":"") +' onchange="toggleFs(this.checked)"><div class="toggle-track"></div><span style="font-weight:600">'+ (fconf.enabled?"推送已开启":"推送已关闭") +'</span></label>';
  const fields=[
    {id:'fAppId',key:'app_id',pw:false},
    {id:'fAppSecret',key:'app_secret',pw:true},
    {id:'fWiki',key:'wiki_node_token',pw:false},
    {id:'fBitable',key:'bitable_token',pw:false},
    {id:'fTableId',key:'bitable_table_id',pw:false},
  ];
  h+='<div style="display:grid;grid-template-columns:1fr;gap:16px">';
  for(const f of fields){
    const meta=fmeta[f.key]||{};
    const label=meta.label||f.key;
    const desc=meta.desc||'';
    h+='<div><label class="form-label">'+esc(label)+'</label><input type="'+(f.pw?'password':'text')+'" id="'+f.id+'" value="'+esc(fconf[f.key]||'')+'" placeholder="'+esc(desc)+'"><div class="text-sm text-muted" style="margin-top:3px">'+esc(desc)+'</div></div>';
  }
  h+='</div>';
  h+='<div style="margin-top:20px;display:flex;align-items:center;gap:12px"><button class="btn btn-primary" onclick="saveFeishu()">保存配置</button><a href="https://open.feishu.cn/document/home/index" target="_blank" rel="noopener" style="font-size:12px;color:var(--primary)">飞书开放平台文档 &#x2197;</a></div>';
  h+='</div>';
  document.getElementById('content').innerHTML=h;
};
// Tab: 定时任务 (standalone)
renderers.schedule=async()=>{
  const cfg=await api('/api/config');if(_currentTab!=='schedule')return;const sc=cfg.schedule||{};
  $('#topbarActions').innerHTML='';
  let h='<div class="card" style="max-width:700px"><div class="card-header"><h3>定时任务</h3></div>';
  h+='<label class="toggle" style="margin-bottom:20px;display:flex"><input type="checkbox" '+ (sc.enabled?"checked":"") +' onchange="toggleSchedule(this.checked)"><div class="toggle-track"></div><span style="font-weight:600">'+ (sc.enabled?"定时已开启":"定时已关闭") +'</span></label>';
  h+='<div class="form-grid">';
  h+='<div><label class="form-label">岗位类型</label><select id="scJobType" onchange="saveScheduleField()"><option value="social" '+ (sc.job_type==='social'?'selected':'') +'>社招</option><option value="campus" '+ (sc.job_type==='campus'?'selected':'') +'>校招</option><option value="internship" '+ (sc.job_type==='internship'?'selected':'') +'>实习</option></select></div>';
  h+='<div><label class="form-label">搜索关键词</label><input id="scKeyword" value="'+esc(sc.keyword||'产品经理')+'" onchange="saveScheduleField()"></div>';
  h+='</div>';
  h+='<div class="schedule-options">';
  h+='<label class="toggle"><input type="checkbox" '+ (sc.feishu_push?"checked":"") +' onchange="saveScheduleToggle(&quot;feishu_push&quot;,this.checked)"><div class="toggle-track"></div><span>完成后飞书推送</span></label>';
  h+='<label class="toggle"><input type="checkbox" '+ (sc.git_push?"checked":"") +' onchange="saveScheduleToggle(&quot;git_push&quot;,this.checked)"><div class="toggle-track"></div><span>完成后 Git 提交</span></label>';
  h+='</div>';
  if(sc.last_run)h+='<div class="text-sm text-muted" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">上次运行: '+esc(sc.last_run)+'</div>';

  h+='</div>';
  document.getElementById('content').innerHTML=h;
};
window.toggleSchedule=async(en)=>{await api('/api/config',{method:'PUT',body:JSON.stringify({schedule:{enabled:en}})});toast(en?'定时已开启':'定时已关闭');renderers.schedule()};
window.saveScheduleField=async()=>{await api('/api/config',{method:'PUT',body:JSON.stringify({schedule:{job_type:$('#scJobType').value,keyword:$('#scKeyword').value.trim()}})});toast('已保存')};
window.saveScheduleToggle=async(field,val)=>{const b={};b[field]=val;await api('/api/config',{method:'PUT',body:JSON.stringify({schedule:b})});toast('已保存')};

// ── Init ──
switchTab('tasks');
</script>
