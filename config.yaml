# SmartJobHunter Agent 配置文件

# 全局配置
global:
  max_concurrent_tasks: 3
  threshold_score: 70        # 推送阈值
  time_filter_days: 3        # 时间过滤（最近N天）
  jd_truncate_length: 6000   # JD文本截断长度

# 求职意向列表
profiles:
  - name: "产品经理-TOB方向"
    intent: |
      寻找 TOB SaaS 产品经理岗位，偏好企业服务、数据智能、AI方向。
      有 5 年产品经验，擅长需求分析、产品规划、数据驱动决策。
      期望薪资 30-50K，工作地点北京。
    resume_path: "./resumes/pm_tob.txt"
    job_type: "社招"  # 实习/校招/社招
    targets:
      - company: "tencent"
        keywords: ["产品经理"]
      - company: "bytedance"
        keywords: ["产品经理"]
    keywords:
      - "产品经理"
      - "产品总监"
      - "TOB"
      - "SaaS"
      - "企业服务"
      - "B端"
      - "AI产品"
      - "AI解决方案"
      - "人工智能"
      - "大模型"
      - "数据产品"

# 岗位性质配置
job_types:
  internship:  # 实习
    name: "实习"
    keywords: ["实习", "intern", "Intern"]
    exclude: ["社招", "正式"]
  campus:  # 校招
    name: "校招"
    keywords: ["校招", "校园", "应届", "毕业生"]
    exclude: ["实习", "社招"]
  social:  # 社招
    name: "社招"
    keywords: ["社招", "社会招聘", "正式"]
    exclude: ["实习", "校招", "应届"]

# 输出配置
output:
  base_dir: "./output"
  format: "markdown"
  filename_pattern: "{date}_{profile_name}.md"
